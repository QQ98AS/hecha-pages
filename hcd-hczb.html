<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>核查端建筑业核查</title>
  <style>
    :root {
      --bg: #f3efe7;
      --panel: rgba(255, 252, 247, 0.92);
      --panel-strong: #fffdfa;
      --line: rgba(91, 67, 43, 0.12);
      --line-strong: rgba(91, 67, 43, 0.18);
      --text: #2f261d;
      --muted: #72685d;
      --primary: #8c4f28;
      --primary-soft: rgba(140, 79, 40, 0.12);
      --accent: #1b695f;
      --accent-soft: rgba(27, 105, 95, 0.14);
      --warn: #cb8a31;
      --warn-soft: rgba(203, 138, 49, 0.16);
      --danger: #b44d3e;
      --danger-soft: rgba(180, 77, 62, 0.15);
      --shadow: 0 22px 52px rgba(58, 41, 25, 0.12);
      --radius-xl: 30px;
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      color: var(--text);
      font-family: "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 0% 0%, rgba(140, 79, 40, 0.14), transparent 24%),
        radial-gradient(circle at 100% 0%, rgba(27, 105, 95, 0.14), transparent 22%),
        linear-gradient(135deg, #f9f6f1 0%, #f0e5d7 55%, #e8d8c8 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.45), transparent 84%);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .app-shell {
      position: relative;
      height: 100vh;
      padding: 22px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 18px;
      overflow: hidden;
    }

    .top-sticky-shell {
      position: relative;
      z-index: 40;
      display: grid;
      gap: 18px;
      align-self: start;
      min-height: 0;
    }

    .hero,
    .nav-panel,
    .content-panel,
    .detail-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .hero {
      border-radius: var(--radius-xl);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      position: relative;
      border: 1px solid rgba(123, 63, 29, 0.12);
      box-shadow: var(--shadow);
      background:
        radial-gradient(circle at top right, rgba(181, 118, 60, 0.22), transparent 30%),
        radial-gradient(circle at left center, rgba(150, 71, 39, 0.14), transparent 34%),
        linear-gradient(180deg, rgba(228, 214, 198, 0.99), rgba(242, 232, 222, 0.97)),
        linear-gradient(135deg, #dfcbb6, #f3e6d8);
      color: var(--text);
      box-shadow:
        inset 0 4px 0 #9e4e2b,
        var(--shadow);
    }

    .hero-main,
    .hero-side {
      padding: 26px 28px;
    }

    .hero-main {
      display: grid;
      gap: 18px;
      padding-right: 580px;
    }

    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      width: fit-content;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      font-size: 0.76rem;
      letter-spacing: 0.04em;
    }

    .hero-main h1 {
      margin: 0;
      font-size: clamp(1.9rem, 4vw, 3rem);
      line-height: 1.15;
      letter-spacing: 0.02em;
      color: #3f2c1d;
    }

    .hero-name-code {
      margin-left: 12px;
      font-size: 0.42em;
      font-weight: 600;
      color: #8a715b;
      white-space: nowrap;
    }

    .hero-main p {
      margin: 0;
      max-width: 860px;
      color: rgba(255, 249, 243, 0.88);
      line-height: 1.8;
      font-size: 0.94rem;
    }

    .hero-top-right {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      gap: 10px;
      max-width: calc(100% - 40px);
    }

    .hero-summary-row {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .hero-case-card {
      position: static;
      width: 260px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255, 251, 246, 0.96);
      border: 1px solid rgba(123, 63, 29, 0.12);
      border-left: 4px solid #9e4e2b;
      backdrop-filter: blur(10px);
      display: grid;
      gap: 4px;
      box-shadow: 0 12px 24px rgba(59, 41, 24, 0.1);
    }

    .hero-case-card span {
      font-size: 0.68rem;
      color: #8a715b;
    }

    .hero-case-card strong {
      font-size: 0.84rem;
      line-height: 1.35;
      color: #3f2c1d;
      word-break: break-all;
    }

    .hero-summary-item {
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255, 251, 246, 0.92);
      border: 1px solid rgba(123, 63, 29, 0.1);
      border-top: 2px solid rgba(158, 78, 43, 0.82);
      display: grid;
      gap: 4px;
    }

    .hero-summary-item.combined {
      margin-left: auto;
      width: fit-content;
      min-width: 0;
      padding: 10px 12px;
      background: rgba(255, 251, 246, 0.96);
      border: 1px solid rgba(123, 63, 29, 0.12);
      border-left: 4px solid #9e4e2b;
      box-shadow: 0 12px 24px rgba(59, 41, 24, 0.1);
      gap: 4px;
    }

    .hero-summary-item span {
      font-size: 0.68rem;
      color: #8a715b;
    }

    .hero-summary-item strong {
      font-size: 0.88rem;
      line-height: 1.28;
      color: #3f2c1d;
    }

    .hero-summary-item.combined span {
      font-size: 0.68rem;
      color: #8a715b;
    }

    .hero-summary-item.combined strong {
      font-size: 0.84rem;
      line-height: 1.35;
      color: #3f2c1d;
      white-space: nowrap;
    }

    .qualification-board {
      background:
        linear-gradient(180deg, rgba(248, 241, 232, 0.98), rgba(255, 250, 244, 0.95)),
        var(--panel);
      border: 1px solid rgba(123, 63, 29, 0.1);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      padding: 12px 16px;
      display: grid;
      gap: 10px;
      box-shadow:
        inset 0 3px 0 rgba(158, 78, 43, 0.82),
        var(--shadow);
    }

    .qualification-board-head {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .qualification-board-head h2 {
      margin: 0;
      font-size: 0.94rem;
      color: #3f2c1d;
    }

    .qualification-board-head h2 span {
      margin-left: 10px;
      color: #8a715b;
      font-size: 0.74rem;
      line-height: 1.45;
      font-weight: 400;
    }

    .qualification-grid {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 2px;
      scrollbar-width: thin;
    }

    .qualification-item {
      flex: 0 0 auto;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(123, 63, 29, 0.1);
      background: rgba(255, 252, 248, 0.94);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .qualification-kind {
      font-size: 0.64rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .qualification-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px 7px;
      border-radius: 999px;
      font-size: 0.64rem;
      font-weight: 800;
      line-height: 1;
      white-space: nowrap;
    }

    .qualification-status.valid {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .qualification-status.abnormal {
      background: var(--warn-soft);
      color: var(--warn);
    }

    .qualification-status.invalid {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .qualification-item strong {
      font-size: 0.78rem;
      line-height: 1.25;
      color: var(--text);
      white-space: nowrap;
    }

    .qualification-item.current {
      background: linear-gradient(135deg, rgba(158, 78, 43, 0.1), rgba(214, 168, 108, 0.18));
      border-color: rgba(158, 78, 43, 0.24);
      box-shadow: inset 0 0 0 1px rgba(158, 78, 43, 0.08);
    }

    .enterprise-status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      line-height: 1;
    }

    .enterprise-status.open {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .enterprise-status.departed {
      background: var(--warn-soft);
      color: var(--warn);
    }

    .enterprise-status.cancelled {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .hero-side {
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      display: grid;
      gap: 14px;
      align-content: center;
      background: rgba(255, 255, 255, 0.06);
    }

    .hero-side h2 {
      margin: 0;
      font-size: 1rem;
      color: rgba(255, 249, 243, 0.96);
    }

    .hero-side p {
      margin: 0;
      color: rgba(255, 249, 243, 0.78);
      line-height: 1.7;
      font-size: 0.84rem;
    }

    .hero-stat-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .hero-stat {
      padding: 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: grid;
      gap: 6px;
    }

    .hero-stat span {
      font-size: 0.72rem;
      color: rgba(255, 249, 243, 0.72);
    }

    .hero-stat strong {
      font-size: 1.35rem;
      line-height: 1;
      color: #fff;
    }

    .workspace {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 320px;
      gap: 18px;
      min-height: 0;
      height: 100%;
      overflow: hidden;
    }

    .nav-panel,
    .content-panel,
    .detail-panel {
      border-radius: var(--radius-lg);
      min-height: 0;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .content-panel {
      overflow-x: hidden;
      overflow-y: auto;
    }

    .content-top {
      position: sticky;
      top: 0;
      z-index: 6;
      display: grid;
      background: linear-gradient(180deg, rgba(255, 252, 247, 0.98), rgba(255, 252, 247, 0.98));
    }

    .panel-head {
      padding: 20px 20px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.48);
    }

    .panel-head.compact {
      padding: 16px 20px 10px;
    }

    .panel-head.hidden {
      display: none;
    }

    .panel-head h2,
    .panel-head h3 {
      margin: 0;
      font-size: 1rem;
      line-height: 1.3;
    }

    .panel-head p {
      margin: 7px 0 0;
      color: var(--muted);
      line-height: 1.65;
      font-size: 0.8rem;
    }

    .toolbar,
    .detail-summary {
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.42);
    }

    .nav-scroll,
    .content-scroll,
    .detail-scroll {
      flex: 1 1 auto;
      height: 0;
      min-height: 0;
      overflow: auto;
    }

    .nav-scroll {
      padding: 16px 20px 20px;
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .module-group-card {
      border-radius: 18px;
      border: 1px solid rgba(91, 67, 43, 0.1);
      background: rgba(255, 255, 255, 0.88);
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .module-group-head {
      display: flex;
      justify-content: flex-start;
      align-items: start;
      gap: 10px;
      padding: 2px 2px 0;
    }

    .module-group-head strong {
      font-size: 0.94rem;
      line-height: 1.35;
    }

    .module-group-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.6;
    }

    .module-group-list {
      display: grid;
      gap: 10px;
    }

    .module-nav-item {
      position: relative;
      width: 100%;
      text-align: left;
      border-radius: 16px;
      border: 1px solid rgba(91, 67, 43, 0.08);
      background: rgba(255, 255, 255, 0.92);
      padding: 12px 13px;
      display: grid;
      gap: 8px;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .module-nav-item:hover {
      transform: translateY(-1px);
    }

    .module-nav-item.active {
      border-color: rgba(140, 79, 40, 0.34);
      box-shadow:
        inset 0 0 0 1px rgba(140, 79, 40, 0.12),
        0 12px 24px rgba(140, 79, 40, 0.12);
      background: linear-gradient(135deg, rgba(248, 235, 221, 0.98), rgba(255, 251, 246, 0.92));
    }

    .module-nav-item.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10px;
      bottom: 10px;
      width: 4px;
      border-radius: 0 999px 999px 0;
      background: linear-gradient(180deg, #a85d2d, #d08a45);
    }

    .module-nav-item-top {
      display: flex;
      justify-content: flex-start;
      align-items: start;
      gap: 10px;
    }

    .module-nav-item strong {
      font-size: 0.86rem;
      line-height: 1.35;
    }

    .module-nav-item-note {
      color: var(--muted);
      font-size: 0.74rem;
      line-height: 1.55;
    }

    .module-card {
      position: relative;
      width: 100%;
      text-align: left;
      border-radius: 20px;
      border: 1px solid rgba(91, 67, 43, 0.08);
      background: rgba(255, 255, 255, 0.84);
      padding: 16px 16px 15px;
      display: grid;
      gap: 10px;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .module-card:hover {
      transform: translateY(-1px);
    }

    .module-card.active {
      border-color: rgba(140, 79, 40, 0.34);
      box-shadow:
        inset 0 0 0 1px rgba(140, 79, 40, 0.12),
        0 12px 24px rgba(140, 79, 40, 0.12);
      background: linear-gradient(135deg, rgba(248, 235, 221, 0.98), rgba(255, 251, 246, 0.92));
    }

    .module-card.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 14px;
      bottom: 14px;
      width: 4px;
      border-radius: 0 999px 999px 0;
      background: linear-gradient(180deg, #a85d2d, #d08a45);
    }

    .module-card.active strong {
      color: #7b3f1d;
    }

    .module-card.active p {
      color: #6a5644;
    }

    .module-card-top {
      display: flex;
      justify-content: flex-start;
      gap: 10px;
      align-items: start;
    }

    .module-card strong {
      font-size: 0.92rem;
      line-height: 1.35;
    }

    .module-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.65;
    }

    .module-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .badge.primary {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .badge.ok {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .badge.warn {
      background: var(--warn-soft);
      color: var(--warn);
    }

    .badge.risk {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .toolbar {
      display: grid;
      gap: 10px;
    }

    .toolbar-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .toolbar-search {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .toolbar-search.builder-search {
      display: flex;
      justify-content: end;
      align-items: center;
      flex-wrap: wrap;
    }

    .toolbar-search.equipment-search {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      flex-wrap: wrap;
    }

    .toolbar-search.equipment-search .search-input {
      flex: 0 1 360px;
      width: min(360px, 100%);
    }

    .toolbar-search.equipment-search .search-button {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .toolbar-search.achievement-search {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      flex-wrap: wrap;
    }

    .toolbar-search.achievement-search .search-input {
      flex: 0 1 360px;
      width: min(360px, 100%);
    }

    .toolbar-search.achievement-search .search-button {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .toolbar-search.attachment-search {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      flex-wrap: wrap;
    }

    .toolbar-search.attachment-search .search-input {
      flex: 0 1 360px;
      width: min(360px, 100%);
      margin-left: auto;
    }

    .toolbar-search.attachment-search .search-button {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .toolbar-search.builder-search .filter-select {
      flex: 0 1 320px;
      width: min(320px, 100%);
    }

    .toolbar-search.builder-search .search-button {
      justify-self: end;
      white-space: nowrap;
    }

    .toolbar-search.leader-search {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      flex-wrap: wrap;
    }

    .toolbar-search.leader-search .search-input {
      flex: 0 1 360px;
      width: min(360px, 100%);
      margin-left: auto;
    }

    .toolbar-search.leader-search .search-button {
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .leader-major-stats {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      min-width: 0;
    }

    .builder-major-stats {
      width: 100%;
      padding-top: 2px;
      max-width: 100%;
      overflow-x: auto;
      flex-wrap: nowrap;
    }

    .builder-table-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 2px 10px;
      flex-wrap: wrap;
    }

    .builder-table-toolbar .builder-major-stats {
      width: auto;
      padding-top: 0;
      overflow-x: visible;
      flex: 1 1 auto;
      justify-content: flex-start;
    }

    .builder-pagination {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 2px 0;
      color: var(--muted);
      font-size: 0.76rem;
      flex-wrap: wrap;
    }

    .builder-pagination-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-select {
      position: relative;
      min-width: 0;
    }

    .filter-select-toggle {
      width: 100%;
      min-height: 42px;
      border: 1px solid rgba(91, 67, 43, 0.12);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--text);
      padding: 8px 12px;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      text-align: left;
    }

    .filter-select-value {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex-wrap: wrap;
    }

    .filter-select-placeholder {
      color: var(--muted);
      white-space: nowrap;
    }

    .filter-select-arrow {
      color: var(--muted);
      font-size: 0.72rem;
      flex: 0 0 auto;
    }

    .filter-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 100%;
      padding: 10px;
      border-radius: 16px;
      border: 1px solid rgba(91, 67, 43, 0.12);
      background: #fffdf8;
      box-shadow: 0 16px 32px rgba(82, 54, 25, 0.14);
      display: grid;
      gap: 10px;
      z-index: 20;
    }

    .filter-dropdown[hidden] {
      display: none;
    }

    .filter-option-list {
      display: grid;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .filter-option {
      width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(91, 67, 43, 0.1);
      background: rgba(255, 255, 255, 0.96);
      color: var(--text);
      padding: 8px 10px;
      font-size: 0.8rem;
      text-align: left;
      display: flex;

    const formatEnterpriseEquipmentSpec = (value) => {
      const parts = String(value || "").split("/").map((part) => part.trim()).filter(Boolean);
      if (!parts.length) return "-";
      const isDate = (part) => /^\d{4}-\d{2}$/.test(part);
      const isOrigin = (part) => /(?:北京|天津|上海|重庆|河北|河南|山东|山西|江苏|浙江|安徽|福建|江西|湖北|湖南|广东|广西|海南|四川|贵州|云南|陕西|甘肃|青海|辽宁|吉林|黑龙江|内蒙古|宁夏|新疆|西藏|香港|澳门|台湾|德国|日本|美国|韩国|徐州|常州|长沙|洛阳|合肥|无锡)$/.test(part);
      const cleaned = parts.filter((part) => !isDate(part) && !isOrigin(part));
      return cleaned.length ? cleaned.join(" / ") : parts[0];
    };

    function getBuilderMajor(card) {
      const majorMeta = (card.meta || []).find((item) => item.startsWith("注册专业：")) || "";
      return getBuilderMajors(card).join("，") || majorMeta.replace(/^注册专业：/, "").trim();
    }

    function getBuilderMajors(card) {
      const majorMeta = (card.meta || []).find((item) => item.startsWith("注册专业：")) || "";
      const majorText = majorMeta.replace(/^注册专业：/, "").trim();
      if (!majorText) return [];
      return majorText
        .split(/[,，、;；/]+/)
        .map((item) => item.trim())
        .filter(Boolean);
    }

    function getBuilderLevel(card) {
      const levelMeta = (card.meta || []).find((item) => item.startsWith("级别：")) || "";
      return levelMeta.replace(/^级别：/, "").trim();
    }

    function getBuilderLevelMajorCounts() {
      const personnelModule = modules.find((module) => module.id === "personnel");
      const cardsSection = personnelModule?.sections?.find((section) => section.type === "cards");
      const cards = (cardsSection?.cards || []).filter((card) => card.subtype === "注册建造师");
      return cards.reduce((result, card) => {
        const level = getBuilderLevel(card) || "未填写级别";
        const majors = getBuilderMajors(card);
        (majors.length ? majors : ["未填写专业"]).forEach((major) => {
          const label = `${level}${major}`;
          result[label] = (result[label] || 0) + 1;
        });
        return result;
      }, {});
    }

    function getBuilderMajorOptions() {
      const personnelModule = modules.find((module) => module.id === "personnel");
      const cardsSection = personnelModule?.sections?.find((section) => section.type === "cards");
      const cards = (cardsSection?.cards || []).filter((card) => card.subtype === "注册建造师");
      return [...new Set(cards.flatMap((card) => getBuilderMajors(card)).filter(Boolean))];
    }

    function getTechLeaderTitleMajor(card) {
      const titleMajorMeta = (card.meta || []).find((item) => item.startsWith("职称专业：")) || "";
      return titleMajorMeta ? titleMajorMeta.replace(/^职称专业：/, "").trim() : "";
    }

    function getPersonnelTitleInfo(card) {
      const meta = card.meta || [];
      const titleCertificateMeta = meta.find((item) => item.startsWith("职称证书编号：")) || "";
      const titleMajorMeta = meta.find((item) => item.startsWith("职称专业：")) || "";
      const titleLevelMeta = meta.find((item) => item.startsWith("职称等级：")) || "";
      return {
        certificate: titleCertificateMeta ? titleCertificateMeta.replace(/^职称证书编号：/, "").trim() : "",
        major: titleMajorMeta ? titleMajorMeta.replace(/^职称专业：/, "").trim() : "",
        level: titleLevelMeta ? titleLevelMeta.replace(/^职称等级：/, "").trim() : ""
      };
    }

    function getTechWorkerInfo(card) {
      const meta = card.meta || [];
      const idMeta = meta.find((item) => item.startsWith("身份证号：")) || "";
      const certificateMeta = meta.find((item) => item.startsWith("岗位证书编号：")) || "";
      const tradeMeta = meta.find((item) => item.startsWith("工种：")) || "";
      return {
        idNumber: idMeta.replace(/^身份证号：/, "").trim(),
        certificate: certificateMeta.replace(/^岗位证书编号：/, "").trim(),
        trade: tradeMeta.replace(/^工种：/, "").trim()
      };
    }

    function getTechLeaderMajorCounts() {
      const personnelModule = modules.find((module) => module.id === "personnel");
      const cardsSection = personnelModule?.sections?.find((section) => section.type === "cards");
      const subtype = isTitlePersonModuleView() ? "职称人员" : "技术负责人";
      const cards = getFilteredCards((cardsSection?.cards || []).filter((card) => card.subtype === subtype));
      return cards.reduce((result, card) => {
        const info = getPersonnelTitleInfo(card);
        const major = info.major || info.level || "未填写职称专业";
        result[major] = (result[major] || 0) + 1;
        return result;
      }, {});
    }

    function updateTechLeaderPageSize() {
      if (!(isTechLeaderModuleView() || isTitlePersonModuleView() || isTechWorkerModuleView()) || !elements.contentBody) return;
      const contentHeight = elements.contentBody.clientHeight || 0;
      if (!contentHeight) return;
      const reservedHeight = 184;
      const rowHeight = 66;
      const availableHeight = Math.max(0, contentHeight - reservedHeight);
      const nextPageSize = Math.max(3, Math.floor(availableHeight / rowHeight));
      state.techLeaderPageSize = nextPageSize;
    }

      const isTechLeaderCard = module.id === "personnel" && card.subtype === "技术负责人";
      const isTitlePersonCard = module.id === "personnel" && card.subtype === "职称人员";
      const isTechWorkerCard = module.id === "personnel" && card.subtype === "技术工人";
      const isEquipmentCard = module.id === "equipment";
      const isAttachmentCard = module.id === "attachment" && ["营业执照", "安许证", "法人身份证复印件", "授权委托书", "授权委托人身份证"].includes(card.subtype);

      if (!(isBuilderCard || isTechLeaderCard || isTitlePersonCard || isTechWorkerCard || isEquipmentCard || isAttachmentCard)) {
        return [];
      }

      const attachmentLabel = isAttachmentCard
        ? card.name
        : isEquipmentCard
        ? "设备附件"
        : isBuilderCard
          ? "注册证书附件"
        : isTechLeaderCard
          ? "职称附件"
          : isTitlePersonCard
            ? "职称证书附件"
            : "岗位证书附件";
      const attachmentMeta = isBuilderCard
        ? (card.meta.find((item) => item.startsWith("注册证书附件：")) || "")
        : isTechLeaderCard
          ? (card.meta.find((item) => item.startsWith("附件材料：")) || "")
        : "";
      const attachmentFileName = attachmentMeta
        ? isTechLeaderCard
          ? attachmentMeta.replace(/^附件材料：/, "").split(/[,，]/)[0].trim()
          : attachmentMeta.replace(/^注册证书附件：/, "").trim()
        : "";
      const attachmentExt = (attachmentFileName.split(".").pop() || "").toLowerCase();
      const attachmentMetaDisplay = /^(png|jpe?g|bmp|webp|gif)$/i.test(attachmentExt)
        ? { displayText: "图片附件", thumbText: "图片", thumbClass: "image" }
        : { displayText: "PDF附件", thumbText: "PDF", thumbClass: "pdf" };

      return [
        { text: attachmentMetaDisplay.displayText, type: "preview", label: attachmentLabel, thumbText: attachmentMetaDisplay.thumbText, displayText: attachmentMetaDisplay.displayText, thumbClass: attachmentMetaDisplay.thumbClass },
        { text: "打印", type: "print", label: attachmentLabel }
      ];
    }

    function openPreviewModal(module, card, actionType = "preview") {
      const actions = getCardAttachmentActions(module, card);
      const previewAction = actions.find((item) => item.type === "preview");
      const attachmentTitle = previewAction?.label || "附件资料";
      const isTechLeaderCard = module.id === "personnel" && card.subtype === "技术负责人";
      const resolvedAttachmentTitle = isTechLeaderCard ? "职称附件" : attachmentTitle;
      state.previewData = {
        moduleName: module.name,
        cardName: (card.name || "").replace(/\s*\/\s*(注册建造师|技术负责人|职称人员|技术工人)\s*$/, ""),
        attachmentTitle: resolvedAttachmentTitle,
        attachmentFileName: (
          card.meta.find((item) => item.startsWith("注册证书附件：")) ||
          card.meta.find((item) => item.startsWith("附件材料：")) ||
          card.meta.find((item) => item.startsWith("岗位证书附件：")) ||
          card.meta.find((item) => item.startsWith("设备发票附件：")) ||
          card.meta.find((item) => item.startsWith("参数佐证附件：")) ||
          ""
        ).replace(/^(注册证书附件：|附件材料：|岗位证书附件：|设备发票附件：|参数佐证附件：)/, "").split(/[,，]/)[0].trim(),

      };
      renderPreviewModal();
    }

      state.previewData = null;

    function renderPreviewModal() {
      const data = state.previewData;

      elements.previewTitle.textContent = `${data.cardName} - ${data.attachmentTitle}`;
      elements.previewSubtitle.textContent = `${data.moduleName}目录附件在线预览，可直接打印。`;
      if (data.attachmentUrl && data.attachmentKind === "image") {
        elements.previewSheet.innerHTML = `
          <div class="preview-sheet-head">
            <strong>${data.attachmentFileName}</strong>

          </div>
          <div class="preview-media">
            <img src="${data.attachmentUrl}" alt="${data.attachmentFileName}">
          </div>

          <div class="preview-sheet-head">

            <span class="badge primary">PDF</span>

    function renderDetailHeadText(module) {
      if (!elements.detailHeadText) return;

      if (module.id === "attachment") {
        const selectedCard = getSelectedCard(module);
        const attachmentSubtype = selectedCard?.subtype || state.activeSubtype;
        if (attachmentSubtype === "营业执照") {
          elements.detailHeadText.textContent = "营业执照在有效期内。";
          return;
        }
        if (attachmentSubtype === "安许证") {
          elements.detailHeadText.textContent = "安全生产许可证在有效期内。";
          return;
        }
        if (attachmentSubtype === "法人身份证复印件") {
          elements.detailHeadText.textContent = "法人身份证复印件已上传。";
          return;
        }
        if (attachmentSubtype === "授权委托书") {
          elements.detailHeadText.textContent = "授权委托书已盖章，可用于核验企业授权代表办理核查事项。";
          return;
        }

          elements.detailHeadText.textContent = "授权委托人身份证已上传，可用于核验授权代表身份。";
          return;
        }
      }

      if (module.id === "personnel") {
        const subtypeText = state.activeSubtype || "人员";
        if (subtypeText === "注册建造师") {
          const qualificationName = enterpriseProfile.qualification.replace(/资质核查$/, "");
          elements.detailHeadText.textContent = `${qualificationName}，建造师要求：${getBuilderStandardText()}`;
          return;
        }
        const builderText = subtypeText === "注册建造师" ? `，建造师标准：${getBuilderStandardText()}` : "";
        const techLeaderText = subtypeText === "技术负责人" ? `，技术负责人标准：${getTechLeaderStandardText()}` : "";
        const titlePersonText = subtypeText === "职称人员" ? `，职称人员标准：${getTitlePersonStandardText()}` : "";
        const techWorkerText = subtypeText === "技术工人" ? `，技术工人标准：${getTechWorkerStandardText()}` : "";
        elements.detailHeadText.textContent = `展示此资质的${subtypeText}核查标准${builderText}${techLeaderText}${titlePersonText}${techWorkerText}，核查结论和核查附件。`;

        return;
      }

      if (module.id === "achievement") {
        elements.detailHeadText.textContent = "展示此资质的企业业绩核查标准，核查结论和核查附件。";
        return;
      }

      elements.detailHeadText.textContent = "展示核查结论和核查附件。";
    }

    function getSubtypeOptions(module) {
      return module.id === "personnel" ? module.subtypes : ["全部", ...module.subtypes];
    }

    function getDefaultSubtype(module) {
      return module.id === "personnel" ? module.subtypes[0] : "全部";
    }

    function getLevelBadgeClass(level) {
      if (level === "warn") return "warn";
      if (level === "accent") return "ok";
      return "primary";
    }

    function getSubtypeOptions(module) {
      return module.id === "personnel" || module.id === "equipment" ? module.subtypes : ["鍏ㄩ儴", ...module.subtypes];
    }

    function getDefaultSubtype(module) {
      return module.id === "personnel" || module.id === "equipment" ? module.subtypes[0] : "鍏ㄩ儴";
    }

    function getSubtypeOptions(module) {
      return module.id === "personnel" || module.id === "equipment" ? module.subtypes : ["\u5168\u90e8", ...module.subtypes];
    }

    function getDefaultSubtype(module) {
      return module.id === "personnel" || module.id === "equipment" ? module.subtypes[0] : "\u5168\u90e8";
    }

    function getSubtypeOptions(module) {
      return module.id === "personnel" ? module.subtypes : ["\u5168\u90e8", ...module.subtypes];
    }

    function getDefaultSubtype(module) {
      return module.id === "personnel" ? module.subtypes[0] : "\u5168\u90e8";
    }

    function getToolbarSubtypeOptions(module) {
      if (module.id === "personnel") {
        return module.subtypes.filter((option) => option !== "注册建造师" && option !== "技术负责人" && option !== "职称人员" && option !== "技术工人");
      }
      return getSubtypeOptions(module);
    }

    function getFilteredCards(cards) {
      let nextCards = cards;
      if (state.activeSubtype !== "全部") {
        nextCards = nextCards.filter((card) => !card.subtype || card.subtype === state.activeSubtype);
      }
      if (isBuilderModuleView() && state.selectedMajors.length) {
        nextCards = nextCards.filter((card) => {
          const cardMajors = getBuilderMajors(card);
          return state.selectedMajors.some((major) => cardMajors.includes(major));
        });
      }
      return nextCards;
    }

    function getCardKey(module, card) {
      return `${module.id}::${card.subtype || ""}::${card.name || ""}`;
    }

    function getSelectedCard(module) {
      const cardsSection = module.sections?.find((section) => section.type === "cards");
      if (!cardsSection) return null;
      const cards = getFilteredCards(cardsSection.cards || []);
      return cards.find((card) => getCardKey(module, card) === state.selectedCardKey) || cards[0] || null;
    }

    function ensureSelectedCard(module) {
      const cardsSection = module.sections?.find((section) => section.type === "cards");
      const cards = cardsSection ? getFilteredCards(cardsSection.cards || []) : [];
      if (!cards.length) {
        state.selectedCardKey = "";
        return;
      }
      if (!cards.some((card) => getCardKey(module, card) === state.selectedCardKey)) {
        state.selectedCardKey = getCardKey(module, cards[0]);
      }
    }

    function getConclusionStateFromBadge(badge) {
      if (!badge) return "";
      if (badge.type === "ok") return "pass";
      if (badge.type === "risk") return "fail";
      return "";
    }

    function getNormalizedResultBadge(badge) {
      if (!badge) return null;
      if (badge.type === "ok") return { text: "达标", type: "ok" };
      if (badge.type === "risk") return { text: "不达标", type: "risk" };
      return { text: "待核查", type: "warn" };
    }

    function shouldEnableCatalogConclusion(module) {
      return module.id === "personnel" || module.id === "equipment" || module.id === "achievement";
    }

    function getCardConclusionState(module, card) {
      const cardKey = getCardKey(module, card);
      if (state.cardConclusion[cardKey]) {
        return state.cardConclusion[cardKey];
      }
      return getConclusionStateFromBadge((card.badges || [])[0] || null);
    }

    function setCardConclusion(cardKey, conclusion) {
      if (!conclusion) {
        delete state.cardConclusion[cardKey];
        return;
      }
      state.cardConclusion[cardKey] = conclusion;
    }

    function getResultBadgeFromConclusion(conclusion) {
      if (conclusion === "pass") return { text: "达标", type: "ok" };
      if (conclusion === "fail") return { text: "不达标", type: "risk" };
      return { text: "待核查", type: "warn" };
    }

    function getEligibleCards(module) {
      const cardsSection = module.sections?.find((section) => section.type === "cards");
      return cardsSection ? getFilteredCards(cardsSection.cards || []) : [];
    }

    function getSelectedCatalogCardKeys(module) {
      const cards = getEligibleCards(module);
      return cards
        .map((card) => getCardKey(module, card))
        .filter((key) => !!state.cardSelection[key]);
    }

    function getSelectedCardDisplayName(module, card) {
      if (!card) return "";
      if (module.id !== "personnel") return card.name || "";
      return (card.name || "").replace(/\s*\/\s*(注册建造师|技术负责人|职称人员|技术工人)\s*$/, "");
    }

    function getPersonnelCardKey(card) {
      return `${card.subtype || ""}::${card.name || ""}`;
    }

    function getSelectedPersonnelCard(module) {
      if (module.id !== "personnel") return null;
      const cardsSection = module.sections?.find((section) => section.type === "cards");
      if (!cardsSection) return null;
      const cards = getFilteredCards(cardsSection.cards || []);
      return cards.find((card) => getPersonnelCardKey(card) === state.selectedPersonnelKey) || cards[0] || null;
    }

    function ensureSelectedPersonnelCard(module) {
      if (module.id !== "personnel") {
        state.selectedPersonnelKey = "";
        return;
      }
      const cardsSection = module.sections?.find((section) => section.type === "cards");
      const cards = cardsSection ? getFilteredCards(cardsSection.cards || []) : [];
      if (!cards.length) {
        state.selectedPersonnelKey = "";
        return;
      }
      if (!cards.some((card) => getPersonnelCardKey(card) === state.selectedPersonnelKey)) {
        state.selectedPersonnelKey = getPersonnelCardKey(cards[0]);
      }
    }

    function getFilteredSections(module) {
      const keyword = state.search.trim().toLowerCase();
      const selectedMajors = isBuilderModuleView(module) ? state.selectedMajors : [];
      if (!keyword && !selectedMajors.length) return module.sections;

      return module.sections.filter((section) => {
        if (section.type === "cards") {
          return getFilteredCards(section.cards || []).some((card) => {
            if (!keyword) return true;
            const bucket = [
              card.name,
              ...(card.meta || []),
              ...((card.badges || []).map((badge) => badge.text))
            ].join(" ").toLowerCase();
            return bucket.includes(keyword);
          });
        }

        const bucket = [
          section.title,
          section.desc,
          ...(section.items || []).flat(),
          ...(section.timeline || []).flat()
        ].join(" ").toLowerCase();
        return bucket.includes(keyword);
      });
    }

    function renderEquipmentTable(cards, module) {
      if (!cards.length) return "";
      const groups = cards.reduce((result, card) => {

        if (!result[subtype]) result[subtype] = [];
        result[subtype].push(card);
        return result;
      }, {});
      const groupNames = (module.subtypes || Object.keys(groups)).filter((subtype) => groups[subtype]?.length);

      return `
        <div class="equipment-ledger">
          ${groupNames.map((groupName) => {
            const groupCards = groups[groupName];
            const isOpen = state.equipmentOpenGroups[groupName] !== false;
            const totalCount = groupCards.reduce((sum, card) => {
              const countText = (card.meta.find((item) => item.startsWith("数量：")) || "").replace(/^数量：/, "").trim();
              const count = Number.parseFloat(countText);
              return sum + (Number.isFinite(count) ? count : 0);

            const unitText = (groupCards[0]?.meta.find((item) => item.startsWith("单位：")) || "").replace(/^单位：/, "").trim() || "台";

                ${isOpen ? `
                  <div class="equipment-ledger-table-wrap equipment-group-table-wrap">
                    <table class="equipment-ledger-table equipment-group-table">
                      <colgroup>
                        <col style="width: 6%;">
                        <col style="width: 6%;">
                        <col style="width: 22%;">
                        <col style="width: 34%;">
                        <col style="width: 14%;">
                        <col style="width: 18%;">
                      </colgroup>

                        <tr>
                          <th>选择</th>
                          <th>序号</th>

                          const modelName = modelMeta.replace(/^规格型号：/, "").trim() || card.name.split(" ").slice(1).join(" ").trim() || "-";
                          const power = (card.meta.find((item) => item.startsWith("产能功率：")) || "").replace(/^产能功率：/, "").trim() || "-";
                          const displayName = card.name || "-";
                          const invoiceMeta = (card.meta.find((item) => item.startsWith("设备发票附件：")) || "").replace(/^设备发票附件：/, "").trim();
                          const parameterMeta = (card.meta.find((item) => item.startsWith("参数佐证附件：")) || "").replace(/^参数佐证附件：/, "").trim();
                          const modelText = modelName;
                          const cardKey = getCardKey(module, card);
                          const selectedClass = cardKey === state.selectedCardKey ? " selected" : "";
                          const isChecked = !!state.cardSelection[cardKey];

                          return `
                            <tr class="detail-row${selectedClass}" data-card-key="${cardKey}">
                              <td><input class="catalog-check" type="checkbox" data-card-check="${cardKey}" ${isChecked ? "checked" : ""} aria-label="选择${displayName}"></td>

                                    </div>
                                  ` : ""}
                                  ${parameterMeta ? `
                                    <div class="equipment-attachment-slot">
                                      <button class="entity-attachment-thumb parameter" type="button" data-action-type="preview" title="${parameterMeta}" aria-label="${displayName}参数佐证">参</button>
                                    </div>
                                  ` : ""}
                                </div>
                              </td>
                            </tr>
                          `;
                        }).join("")}
                      </tbody>
                    </table>
                  </div>

    function renderSections(module) {
      const sections = getFilteredSections(module);
      if (!sections.length) {
        return `
          <section class="section-card">
            <div class="section-body">
              <div class="info-item">
                <span>未匹配到内容</span>
                <strong>当前关键词没有命中展示说明，可以清空搜索后继续查看。</strong>
              </div>
            </div>
          </section>
        `;
      }

      return sections.map((section) => {
        if (section.type === "grid") return renderGridSection(section);
        if (section.type === "cards") return renderCardsSection(section, module);
        return renderTimelineSection(section);
      }).join("");
    }

    function renderContent() {
      const module = getModule();
      updateTechLeaderPageSize();
      ensureSelectedCard(module);
      const primaryCardsSection = module.sections?.find((section) => section.type === "cards");
      const hideHead = false;
      const title = module.id === "personnel" && primaryCardsSection
        ? `${state.activeSubtype}综合列表`
        : (module.id === "equipment" || module.id === "achievement") && primaryCardsSection
          ? primaryCardsSection.title
          : module.name;
      let desc = module.id === "personnel" || module.id === "equipment" || module.id === "achievement"
        ? (primaryCardsSection?.desc || "")
        : module.desc;
      if (module.id === "personnel" && (state.activeSubtype === "注册建造师" || state.activeSubtype === "技术负责人")) {
        desc = "";
      }
      elements.contentTitle.textContent = title;
      elements.contentDesc.textContent = desc;
      elements.contentDesc.hidden = !desc;
      elements.contentHead.className = hideHead ? "panel-head hidden" : desc ? "panel-head" : "panel-head compact";
      renderSubtypeFilters(module);
      renderMajorFilter();
      elements.contentBody.innerHTML = `${renderOverview(module)}${renderSections(module)}`;
    }

    function renderDetail() {
      const module = getModule();
      renderDetailHeadText(module);
      elements.detailBody.innerHTML = renderConclusionSection(module);
    }

    function render() {
      renderHeroSummary();
      renderQualificationBoard();
      renderModuleListV2();
      renderContent();
      renderDetail();
      elements.contentBody.scrollTop = 0;
      elements.detailBody.scrollTop = 0;
      elements.moduleList.scrollTop = 0;
    }

    elements.moduleList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-module-id]");
      if (!button) return;
      const nextModule = modules.find((module) => module.id === button.dataset.moduleId);
      if (!nextModule) return;
      state.activeModuleId = button.dataset.moduleId;
      state.activeSubtype = button.dataset.moduleSubtype || getDefaultSubtype(nextModule);
      state.search = "";
      state.selectedMajors = [];
      state.majorKeyword = "";
      state.majorDropdownOpen = false;
      state.techLeaderPage = 1;
      elements.searchInput.value = "";
      render();
    });

    elements.subTypeFilters.addEventListener("click", (event) => {
      const button = event.target.closest("[data-subtype]");
      if (!button) return;
      state.activeSubtype = button.dataset.subtype;
      state.selectedMajors = [];
      state.majorKeyword = "";
      state.majorDropdownOpen = false;
      state.techLeaderPage = 1;
      renderContent();
      renderDetail();
    });

      if (!isBuilderModuleView()) return;
      state.majorDropdownOpen = !state.majorDropdownOpen;
      renderMajorFilter();
    });

    elements.majorFilterValue.addEventListener("click", (event) => {
      const removeButton = event.target.closest("[data-remove-major]");
      if (!removeButton) return;
      event.stopPropagation();
      const major = removeButton.dataset.removeMajor;
      state.selectedMajors = state.selectedMajors.filter((item) => item !== major);
      renderContent();
      renderDetail();
    });

    elements.majorFilterInput.addEventListener("input", (event) => {
      state.majorKeyword = event.target.value;
      renderMajorFilter();
    });

    elements.majorFilterOptions.addEventListener("click", (event) => {
      const button = event.target.closest("[data-major-option]");
      if (!button) return;
      const major = button.dataset.majorOption;
      if (state.selectedMajors.includes(major)) {
        state.selectedMajors = state.selectedMajors.filter((item) => item !== major);
      } else {
        state.selectedMajors = [...state.selectedMajors, major];
      }
      renderContent();
      renderDetail();
    });

    document.addEventListener("click", (event) => {
      if (elements.majorFilterWrap.hidden) return;
      if (elements.majorFilterWrap.contains(event.target)) return;
      if (!state.majorDropdownOpen) return;
      state.majorDropdownOpen = false;
      renderMajorFilter();
    });

    elements.contentBody.addEventListener("click", (event) => {
      const techLeaderPageButton = event.target.closest("[data-tech-leader-page-action]");
      if (techLeaderPageButton) {
        event.stopPropagation();
        const action = techLeaderPageButton.getAttribute("data-tech-leader-page-action");
        if (action === "prev" && state.techLeaderPage > 1) {
          state.techLeaderPage -= 1;
        }
        if (action === "next") {
          state.techLeaderPage += 1;
        }
        renderContent();
        elements.contentBody.scrollTop = 0;
        return;

      const equipmentGroupButton = event.target.closest("[data-equipment-group]");
      if (equipmentGroupButton) {
        event.stopPropagation();
        const groupName = equipmentGroupButton.dataset.equipmentGroup;
        state.equipmentOpenGroups[groupName] = state.equipmentOpenGroups[groupName] === false;
        renderContent();
        return;
      }

      const cardCheck = event.target.closest("[data-card-check]");
      const batchCheck = event.target.closest("[data-batch-check]");
      if (cardCheck || batchCheck) {
        event.stopPropagation();
        return;
      }

      const actionButton = event.target.closest("[data-action-type]");
      if (actionButton) {
        event.stopPropagation();
        const cardNode = actionButton.closest("[data-card-key]");
        const module = getModule();
        if (!cardNode || !module) return;
        const cardsSection = module.sections?.find((section) => section.type === "cards");
        const card = (cardsSection?.cards || []).find((item) => getCardKey(module, item) === cardNode.dataset.cardKey);
        if (!card) return;
        openPreviewModal(module, card, actionButton.dataset.actionType);
        return;
      }

      const card = event.target.closest("[data-card-key]");
      if (!card) return;
      state.selectedCardKey = card.dataset.cardKey;
      renderContent();
      renderDetail();
    });

    elements.contentBody.addEventListener("change", (event) => {
      const batchCheck = event.target.closest("[data-batch-check]");
      if (batchCheck) {
        const module = getModule();
        const cards = getEligibleCards(module);
        cards.forEach((card) => {
          const cardKey = getCardKey(module, card);
          state.cardSelection[cardKey] = batchCheck.checked;

        return;

      const cardCheck = event.target.closest("[data-card-check]");

        state.cardSelection[cardCheck.dataset.cardCheck] = cardCheck.checked;

        renderDetail();
      }
    });

    elements.detailBody.addEventListener("change", (event) => {
      const attachmentInput = event.target.closest("#reviewAttachmentInput");
      if (attachmentInput) {
        const acceptedExtensions = /\.(jpg|png|pdf)$/i;
        const maxFileSize = 20 * 1024 * 1024;
        const rejectedFiles = [];

        Array.from(attachmentInput.files || []).forEach((file) => {
          if (!acceptedExtensions.test(file.name) || file.size > maxFileSize) {
            rejectedFiles.push(file.name);
            return;
          }
          state.reviewAttachments.push({
            id: `review-${Date.now()}-${Math.random().toString(36).slice(2)}`,
            name: file.name,
            kind: getReviewAttachmentKind(file.name),
            sizeText: `${(file.size / 1024 / 1024).toFixed(1)} MB`,
            url: URL.createObjectURL(file)
          });
        });

        if (rejectedFiles.length) {
          window.alert(`以下文件格式不支持或超过20 MB：${rejectedFiles.join("、")}`);
        }
        renderDetail();
        return;
      }

      const radio = event.target.closest('input[type="radio"][name^="conclusion-"]');
      if (!radio) return;
      const module = getModule();
      const selectedCard = getSelectedCard(module);
      if (!selectedCard) return;
      setCardConclusion(getCardKey(module, selectedCard), radio.value);
      renderContent();
      renderDetail();
    });

    elements.detailBody.addEventListener("click", (event) => {
      const uploadButton = event.target.closest("#reviewAttachmentUpload");
      if (uploadButton) {
        const input = elements.detailBody.querySelector("#reviewAttachmentInput");
        input?.click();
        return;
      }

      const attachmentButton = event.target.closest("[data-review-attachment-action]");
      if (!attachmentButton) return;
      const attachment = state.reviewAttachments.find((item) => item.id === attachmentButton.dataset.reviewAttachmentId);
      if (!attachment) return;

      if (attachmentButton.dataset.reviewAttachmentAction === "delete") {
        if (attachment.url) URL.revokeObjectURL(attachment.url);
        state.reviewAttachments = state.reviewAttachments.filter((item) => item.id !== attachment.id);
        renderDetail();
        return;
      }

      openReviewAttachmentPreview(attachment);
    });

    elements.previewClose.addEventListener("click", closePreviewModal);
    elements.previewConfirm.addEventListener("click", closePreviewModal);
    elements.previewPrint.addEventListener("click", () => {
      if (!state.previewData) return;
      window.print();
    });
    elements.previewDownload.addEventListener("click", () => {
      if (!state.previewData) return;
      const data = state.previewData;
      if (data.attachmentUrl) {
        const a = document.createElement("a");
        a.href = data.attachmentUrl;
        a.download = data.attachmentFileName || "核查附件";
        a.click();
        return;
      }
      const content = [
        `模块：${data.moduleName}`,
        `对象：${data.cardName}`,
        `附件类型：${data.attachmentTitle}`,
        `附件文件：${data.attachmentFileName || "未命名附件"}`
      ].join("\n");
      const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${data.cardName}-${data.attachmentTitle}.txt`.replace(/[\\/:*?"<>|]/g, "_");
      a.click();
      URL.revokeObjectURL(url);
    });

    elements.previewModal.addEventListener("click", (event) => {
      if (event.target === elements.previewModal) {
        closePreviewModal();
      }
    });

    elements.searchInput.addEventListener("input", (event) => {
      state.search = event.target.value;
      state.techLeaderPage = 1;
      renderContent();
    });

    elements.searchButton.addEventListener("click", () => {
      state.techLeaderPage = 1;
      state.majorDropdownOpen = false;
      renderContent();
      elements.contentBody.scrollTop = 0;
    });

    window.addEventListener("resize", () => {
      if (!isTechLeaderModuleView()) return;
      renderContent();
    });

    function returnToArchiveDoc() {
      const targetPage = "./案卷文书信息-重设计.html";
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "switch-check-task-page", page: targetPage }, "*");
        return;
      }
      window.location.href = targetPage;
    }

    function submitAndReturn() {
      returnToArchiveDoc();
      return;
      if (window.opener && !window.opener.closed) {
        window.close();
        return;
      }
      window.location.href = "交任务核查列表.html";
    }

    function saveReviewConclusion() {
      window.alert("核查结论已保存。");
    }

    render();
  </script>
</body>
</html>
