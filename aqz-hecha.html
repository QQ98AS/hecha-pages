<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>安全证核查展示页</title>
  <style>
    :root {
      --bg: #f3efe7;
      --panel: rgba(255, 252, 247, 0.92);
      --panel-strong: #fffdfa;
      --line: rgba(91, 67, 43, 0.12);
      --line-strong: rgba(91, 67, 43, 0.18);
      --text: #2f261d;
      --muted: #72685d;
      --primary: #8c4f28;
      --primary-soft: rgba(140, 79, 40, 0.12);
      --accent: #1b695f;
      --accent-soft: rgba(27, 105, 95, 0.14);
      --warn: #cb8a31;
      --warn-soft: rgba(203, 138, 49, 0.16);
      --danger: #b44d3e;
      --danger-soft: rgba(180, 77, 62, 0.15);
      --shadow: 0 22px 52px rgba(58, 41, 25, 0.12);
      --radius-xl: 30px;
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      color: var(--text);
      font-family: "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 0% 0%, rgba(140, 79, 40, 0.14), transparent 24%),
        radial-gradient(circle at 100% 0%, rgba(27, 105, 95, 0.14), transparent 22%),
        linear-gradient(135deg, #f9f6f1 0%, #f0e5d7 55%, #e8d8c8 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.45), transparent 84%);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .app-shell {
      position: relative;
      width: min(1680px, calc(100vw - 28px));
      height: calc(100vh - 28px);
      margin: 14px auto;
      padding: 16px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 14px;
      overflow: hidden;
      border-radius: 34px;
      border: 1px solid rgba(123, 63, 29, 0.14);
      background:
        linear-gradient(180deg, rgba(255, 250, 244, 0.92), rgba(250, 243, 235, 0.9)),
        rgba(255, 255, 255, 0.26);
      box-shadow:
        0 30px 80px rgba(58, 41, 25, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(14px);
    }

    .top-sticky-shell {
      position: relative;
      z-index: 40;
      display: grid;
      gap: 12px;
      align-self: start;
      min-height: 0;
    }

    .hero,
    .nav-panel,
    .content-panel,
    .detail-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .hero {
      border-radius: 24px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      position: relative;
      border: 1px solid rgba(123, 63, 29, 0.12);
      box-shadow: var(--shadow);
      background:
        radial-gradient(circle at top right, rgba(181, 118, 60, 0.22), transparent 30%),
        radial-gradient(circle at left center, rgba(150, 71, 39, 0.14), transparent 34%),
        linear-gradient(180deg, rgba(228, 214, 198, 0.99), rgba(242, 232, 222, 0.97)),
        linear-gradient(135deg, #dfcbb6, #f3e6d8);
      color: var(--text);
      box-shadow:
        inset 0 4px 0 #9e4e2b,
        var(--shadow);
    }

    .hero-main,
    .hero-side {
      padding: 18px 20px;
    }

    .hero-main {
      display: grid;
      gap: 10px;
      padding-right: 360px;
    }

    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      width: fit-content;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      font-size: 0.76rem;
      letter-spacing: 0.04em;
    }

    .hero-main h1 {
      margin: 0;
      font-size: clamp(1.45rem, 2.6vw, 2.2rem);
      line-height: 1.2;
      letter-spacing: 0.02em;
      color: #3f2c1d;
    }

    .hero-name-code {
      margin-left: 12px;
      font-size: 0.42em;
      font-weight: 600;
      color: #8a715b;
      white-space: nowrap;
    }

    .hero-main p {
      margin: 0;
      max-width: 860px;
      color: rgba(255, 249, 243, 0.88);
      line-height: 1.8;
      font-size: 0.94rem;
    }

    .hero-top-right {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      gap: 8px;
      max-width: calc(100% - 28px);
    }

    .hero-summary-row {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .hero-case-card {
      position: static;
      width: 220px;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(255, 251, 246, 0.96);
      border: 1px solid rgba(123, 63, 29, 0.12);
      border-left: 4px solid #9e4e2b;
      backdrop-filter: blur(10px);
      display: grid;
      gap: 4px;
      box-shadow: 0 12px 24px rgba(59, 41, 24, 0.1);
    }

    .hero-case-card span {
      font-size: 0.68rem;
      color: #8a715b;
    }

    .hero-case-card strong {
      font-size: 0.78rem;
      line-height: 1.35;
      color: #3f2c1d;
      white-space: nowrap;
    }

    .hero-summary-item {
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(255, 251, 246, 0.92);
      border: 1px solid rgba(123, 63, 29, 0.1);
      border-top: 2px solid rgba(158, 78, 43, 0.82);
      display: grid;
      gap: 4px;
    }

    .hero-summary-item.combined {
      margin-left: auto;
      width: fit-content;
      min-width: 0;
      padding: 8px 10px;
      background: rgba(255, 251, 246, 0.96);
      border: 1px solid rgba(123, 63, 29, 0.12);
      border-left: 4px solid #9e4e2b;
      box-shadow: 0 12px 24px rgba(59, 41, 24, 0.1);
      gap: 4px;
    }

    .hero-summary-item span {
      font-size: 0.68rem;
      color: #8a715b;
    }

    .hero-summary-item strong {
      font-size: 0.88rem;
      line-height: 1.28;
      color: #3f2c1d;
    }

    .hero-summary-item.combined span {
      font-size: 0.68rem;
      color: #8a715b;
    }

    .hero-summary-item.combined strong {
      font-size: 0.78rem;
      line-height: 1.35;
      color: #3f2c1d;
      white-space: nowrap;
    }

    .qualification-board {
      background:
        linear-gradient(180deg, rgba(248, 241, 232, 0.98), rgba(255, 250, 244, 0.95)),
        var(--panel);
      border: 1px solid rgba(123, 63, 29, 0.1);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      padding: 10px 12px;
      display: grid;
      gap: 8px;
      box-shadow:
        inset 0 3px 0 rgba(158, 78, 43, 0.82),
        var(--shadow);
    }

    .qualification-board-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .qualification-board-head h2 {
      margin: 0;
      font-size: 0.88rem;
      color: #3f2c1d;
    }

    .qualification-board-head h2 span {
      margin-left: 10px;
      color: #8a715b;
      font-size: 0.74rem;
      line-height: 1.45;
      font-weight: 400;
    }

    .qualification-grid {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 2px;
      scrollbar-width: thin;
    }

    .qualification-item {
      flex: 0 0 auto;
      padding: 5px 9px;
      border-radius: 999px;
      border: 1px solid rgba(123, 63, 29, 0.1);
      background: rgba(255, 252, 248, 0.94);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .qualification-item span {
      font-size: 0.64rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .qualification-item strong {
      font-size: 0.78rem;
      line-height: 1.25;
      color: var(--text);
      white-space: nowrap;
    }

    .qualification-item.current {
      background: linear-gradient(135deg, rgba(158, 78, 43, 0.1), rgba(214, 168, 108, 0.18));
      border-color: rgba(158, 78, 43, 0.24);
      box-shadow: inset 0 0 0 1px rgba(158, 78, 43, 0.08);
    }

    .qualification-matrix {
      border: 1px solid rgba(123, 63, 29, 0.1);
      border-radius: 18px;
      background: rgba(255, 252, 248, 0.9);
      overflow: hidden;
    }

    .qualification-summary-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 2px 0 0;
    }

    .qualification-collapsible {
      border-top: 1px dashed rgba(123, 63, 29, 0.14);
      padding-top: 8px;
    }

    .qualification-collapsible summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 0.78rem;
      color: #7b5636;
      font-weight: 700;
    }

    .qualification-collapsible summary::-webkit-details-marker {
      display: none;
    }

    .qualification-collapsible-body {
      display: grid;
      gap: 10px;
      padding-top: 8px;
    }

    .qualification-matrix-head,
    .qualification-matrix-row {
      display: grid;
      grid-template-columns: minmax(260px, 1.4fr) repeat(3, minmax(90px, 0.55fr)) minmax(150px, 0.9fr) minmax(180px, 1fr);
      gap: 0;
      align-items: stretch;
    }

    .qualification-matrix-head {
      background: rgba(140, 79, 40, 0.08);
      border-bottom: 1px solid rgba(123, 63, 29, 0.1);
    }

    .qualification-matrix-row + .qualification-matrix-row {
      border-top: 1px solid rgba(123, 63, 29, 0.08);
    }

    .qualification-matrix-row.current {
      background: linear-gradient(135deg, rgba(158, 78, 43, 0.08), rgba(214, 168, 108, 0.12));
    }

    .qualification-matrix-row.covered {
      background: rgba(255, 255, 255, 0.62);
    }

    .qualification-matrix-cell {
      padding: 10px 12px;
      font-size: 0.76rem;
      line-height: 1.5;
      color: var(--text);
      display: flex;
      align-items: center;
      border-right: 1px solid rgba(123, 63, 29, 0.08);
    }

    .qualification-matrix-head .qualification-matrix-cell {
      font-size: 0.72rem;
      font-weight: 700;
      color: #7b5636;
    }

    .qualification-matrix-cell:last-child {
      border-right: 0;
    }

    .qualification-matrix-note {
      color: var(--muted);
      font-size: 0.72rem;
    }

    .qualification-state-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 84px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .qualification-state-badge.basis {
      background: rgba(140, 79, 40, 0.14);
      color: #8c4f28;
    }

    .qualification-state-badge.covered {
      background: rgba(27, 105, 95, 0.14);
      color: #1b695f;
    }

    .hero-side {
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      display: grid;
      gap: 14px;
      align-content: center;
      background: rgba(255, 255, 255, 0.06);
    }

    .hero-side h2 {
      margin: 0;
      font-size: 1rem;
      color: rgba(255, 249, 243, 0.96);
    }

    .hero-side p {
      margin: 0;
      color: rgba(255, 249, 243, 0.78);
      line-height: 1.7;
      font-size: 0.84rem;
    }

    .hero-stat-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .hero-stat {
      padding: 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: grid;
      gap: 6px;
    }

    .hero-stat span {
      font-size: 0.72rem;
      color: rgba(255, 249, 243, 0.72);
    }

    .hero-stat strong {
      font-size: 1.35rem;
      line-height: 1;
      color: #fff;
    }

    .workspace {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr) 300px;
      gap: 14px;
      min-height: 0;
      height: 100%;
      overflow: hidden;
    }

    .nav-panel,
    .content-panel,
    .detail-panel {
      border-radius: var(--radius-lg);
      min-height: 0;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .content-panel {
      overflow-x: hidden;
      overflow-y: auto;
    }

    .content-top {
      position: sticky;
      top: 0;
      z-index: 6;
      display: grid;
      background: linear-gradient(180deg, rgba(255, 252, 247, 0.98), rgba(255, 252, 247, 0.98));
    }

    .content-scroll,
    .detail-scroll {
      padding-bottom: 12px;
    }

    .panel-head {
      padding: 14px 16px 10px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.48);
    }

    .panel-head.compact {
      padding: 12px 16px 8px;
    }

    .panel-head.hidden {
      display: none;
    }

    .panel-head h2,
    .panel-head h3 {
      margin: 0;
      font-size: 0.94rem;
      line-height: 1.3;
    }

    .panel-head p {
      margin: 5px 0 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.74rem;
    }

    .toolbar,
    .detail-summary {
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.42);
    }

    .nav-scroll,
    .content-scroll,
    .detail-scroll {
      flex: 1 1 auto;
      height: 0;
      min-height: 0;
      overflow: auto;
    }

    .nav-scroll {
      padding: 12px 16px 16px;
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .module-group-card {
      border-radius: 18px;
      border: 1px solid rgba(91, 67, 43, 0.1);
      background: rgba(255, 255, 255, 0.88);
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .module-group-head {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 10px;
      padding: 2px 2px 0;
    }

    .module-group-head strong {
      font-size: 0.94rem;
      line-height: 1.35;
    }

    .module-group-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.6;
    }

    .module-group-list {
      display: grid;
      gap: 10px;
    }

    .module-nav-item {
      position: relative;
      width: 100%;
      text-align: left;
      border-radius: 16px;
      border: 1px solid rgba(91, 67, 43, 0.08);
      background: rgba(255, 255, 255, 0.92);
      padding: 12px 13px;
      display: grid;
      gap: 8px;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .module-nav-item:hover {
      transform: translateY(-1px);
    }

    .module-nav-item.active {
      border-color: rgba(140, 79, 40, 0.34);
      box-shadow:
        inset 0 0 0 1px rgba(140, 79, 40, 0.12),
        0 12px 24px rgba(140, 79, 40, 0.12);
      background: linear-gradient(135deg, rgba(248, 235, 221, 0.98), rgba(255, 251, 246, 0.92));
    }

    .module-nav-item.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10px;
      bottom: 10px;
      width: 4px;
      border-radius: 0 999px 999px 0;
      background: linear-gradient(180deg, #a85d2d, #d08a45);
    }

    .module-nav-item-top {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 10px;
    }

    .module-nav-item strong {
      font-size: 0.86rem;
      line-height: 1.35;
    }

    .module-nav-item-note {
      color: var(--muted);
      font-size: 0.74rem;
      line-height: 1.55;
    }

    .module-card {
      position: relative;
      width: 100%;
      text-align: left;
      border-radius: 20px;
      border: 1px solid rgba(91, 67, 43, 0.08);
      background: rgba(255, 255, 255, 0.84);
      padding: 16px 16px 15px;
      display: grid;
      gap: 10px;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .module-card:hover {
      transform: translateY(-1px);
    }

    .module-card.active {
      border-color: rgba(140, 79, 40, 0.34);
      box-shadow:
        inset 0 0 0 1px rgba(140, 79, 40, 0.12),
        0 12px 24px rgba(140, 79, 40, 0.12);
      background: linear-gradient(135deg, rgba(248, 235, 221, 0.98), rgba(255, 251, 246, 0.92));
    }

    .module-card.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 14px;
      bottom: 14px;
      width: 4px;
      border-radius: 0 999px 999px 0;
      background: linear-gradient(180deg, #a85d2d, #d08a45);
    }

    .module-card.active strong {
      color: #7b3f1d;
    }

    .module-card.active p {
      color: #6a5644;
    }

    .module-card-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: start;
    }

    .module-card strong {
      font-size: 0.92rem;
      line-height: 1.35;
    }

    .module-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.65;
    }

    .module-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .badge.primary {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .badge.ok {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .badge.warn {
      background: var(--warn-soft);
      color: var(--warn);
    }

    .badge.risk {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .toolbar {
      display: grid;
      gap: 10px;
    }

    .toolbar-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .toolbar-search {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .toolbar-search.builder-search {
      grid-template-columns: minmax(240px, 320px) minmax(0, 1fr) auto;
    }

    .filter-select {
      position: relative;
      min-width: 0;
    }

    .filter-select-toggle {
      width: 100%;
      min-height: 42px;
      border: 1px solid rgba(91, 67, 43, 0.12);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--text);
      padding: 8px 12px;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: left;
    }

    .filter-select-value {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex-wrap: wrap;
    }

    .filter-select-placeholder {
      color: var(--muted);
      white-space: nowrap;
    }

    .filter-select-arrow {
      color: var(--muted);
      font-size: 0.72rem;
      flex: 0 0 auto;
    }

    .filter-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 100%;
      padding: 10px;
      border-radius: 16px;
      border: 1px solid rgba(91, 67, 43, 0.12);
      background: #fffdf8;
      box-shadow: 0 16px 32px rgba(82, 54, 25, 0.14);
      display: grid;
      gap: 10px;
      z-index: 20;
    }

    .filter-dropdown[hidden] {
      display: none;
    }

    .filter-option-list {
      display: grid;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .filter-option {
      width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(91, 67, 43, 0.1);
      background: rgba(255, 255, 255, 0.96);
      color: var(--text);
      padding: 8px 10px;
      font-size: 0.8rem;
      text-align: left;
    }

    .filter-option.active {
      border-color: rgba(140, 79, 40, 0.2);
      background: rgba(140, 79, 40, 0.08);
      color: var(--primary);
      font-weight: 700;
    }

    .filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding-right: 6px;
    }

    .filter-chip-remove {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 999px;
      background: rgba(140, 79, 40, 0.16);
      color: var(--primary);
      font-size: 0.7rem;

      "C本人员": "C本人员"
    };

    const SAFETY_SUBTYPE_SOURCE_MAP = {
      "A本人员": ["注册建造师"],
      "B本人员": ["技术负责人"],
      "C本人员": ["职称人员", "技术工人"]
    };

    function normalizePersonnelSubtype(subtype) {
      return SAFETY_SUBTYPE_MAP[subtype] || subtype || "";
    }

    function getSafetySourceSubtypes(subtype) {
      return SAFETY_SUBTYPE_SOURCE_MAP[subtype] || [subtype];
    }

    function isPersonnelModule(module = getModule()) {
      return module?.id === "personnel";
    }

    const state = {
      activeModuleId: "personnel",
      activeSubtype: "A本人员",
      search: "",
      selectedMajors: [],
      majorKeyword: "",
      majorDropdownOpen: false,
      previewData: null,
      cardSelection: {},
      cardConclusion: {},
      selectedPersonnelKey: "",
      selectedCardKey: ""
    };

    const elements = {
      heroCaseNo: document.getElementById("heroCaseNo"),
      heroSummary: document.getElementById("heroSummary"),
      heroIntro: document.getElementById("heroIntro"),
      qualificationBoard: document.getElementById("qualificationBoard"),
      moduleList: document.getElementById("moduleList"),
      contentHead: document.getElementById("contentHead"),
      contentTitle: document.getElementById("contentTitle"),
      contentDesc: document.getElementById("contentDesc"),
      subTypeFilters: document.getElementById("subTypeFilters"),
      toolbarSearch: document.getElementById("toolbarSearch"),
      majorFilterWrap: document.getElementById("majorFilterWrap"),
      majorFilterToggle: document.getElementById("majorFilterToggle"),
      majorFilterValue: document.getElementById("majorFilterValue"),
      majorFilterDropdown: document.getElementById("majorFilterDropdown"),
      majorFilterInput: document.getElementById("majorFilterInput"),
      majorFilterOptions: document.getElementById("majorFilterOptions"),
      searchInput: document.getElementById("searchInput"),
      searchButton: document.getElementById("searchButton"),
      contentBody: document.getElementById("contentBody"),
      detailBody: document.getElementById("detailBody"),
      detailHeadText: document.querySelector(".detail-panel .panel-head p"),
      previewModal: document.getElementById("previewModal"),
      previewTitle: document.getElementById("previewTitle"),
      previewSubtitle: document.getElementById("previewSubtitle"),
      previewSheet: document.getElementById("previewSheet"),
      previewClose: document.getElementById("previewClose"),
      previewPrint: document.getElementById("previewPrint"),
      previewConfirm: document.getElementById("previewConfirm")
    };

    function getModule() {
      return modules.find((item) => item.id === state.activeModuleId);
    }

    function isBuilderModuleView(module = getModule()) {
      return false;
    }

    function getBuilderMajor(card) {
      const majorMeta = (card.meta || []).find((item) => item.startsWith("注册专业：")) || "";
      return majorMeta.replace(/^注册专业：/, "").trim();
    }

    function getBuilderMajorOptions() {
      const personnelModule = modules.find((module) => module.id === "personnel");
      const cardsSection = personnelModule?.sections?.find((section) => section.type === "cards");
      const cards = (cardsSection?.cards || []).filter((card) => card.subtype === "注册建造师");
      return [...new Set(cards.map((card) => getBuilderMajor(card)).filter(Boolean))];
    }

    function getVisibleBuilderMajorOptions() {
      const keyword = state.majorKeyword.trim().toLowerCase();
      const options = getBuilderMajorOptions();
      if (!keyword) return options;
      return options.filter((item) => item.toLowerCase().includes(keyword));
    }

    function getCardAttachmentActions(module, card) {
      const normalizedSubtype = normalizePersonnelSubtype(card.subtype);
      const isSafetyPersonnelCard = module.id === "personnel" && ["A本人员", "B本人员", "C本人员"].includes(normalizedSubtype);
      const isEquipmentCard = module.id === "equipment";
      const isAttachmentCard = module.id === "attachment";

      if (!(isSafetyPersonnelCard || isEquipmentCard || isAttachmentCard)) {
        return [];
      }

      const attachmentLabel = isAttachmentCard
        ? card.name
        : isEquipmentCard
        ? "设备附件"
        : normalizedSubtype === "A本人员"
          ? "安全证书附件"
          : normalizedSubtype === "B本人员"
            ? "学历/职称附件"
            : "证书附件";

      return [
        { text: "在线预览", type: "preview", label: attachmentLabel, thumbText: "PDF\n附件" },
        { text: "打印", type: "print", label: attachmentLabel }
      ];
    }

    function openPreviewModal(module, card, actionType = "preview") {
      const actions = getCardAttachmentActions(module, card);
      const previewAction = actions.find((item) => item.type === "preview");
      const attachmentTitle = previewAction?.label || "附件资料";
      state.previewData = {
        moduleName: module.name,
        cardName: (card.name || "").replace(/\s*\/\s*(注册建造师|技术负责人|职称人员|技术工人|A本人员|B本人员|C本人员)\s*$/, ""),
        attachmentTitle,
        actionType
      };
      renderPreviewModal();
    }

    function closePreviewModal() {
      state.previewData = null;
      renderPreviewModal();
    }

    function renderPreviewModal() {
      const data = state.previewData;
      elements.previewModal.hidden = !data;
      if (!data) return;

      elements.previewTitle.textContent = `${data.cardName} - ${data.attachmentTitle}`;
      elements.previewSubtitle.textContent = `${data.moduleName}目录附件在线预览，可直接打印。`;
      elements.previewSheet.innerHTML = `
        <div class="preview-sheet-head">
          <strong>${data.attachmentTitle}</strong>
          <span class="badge primary">${data.moduleName}</span>
        </div>
        <div class="preview-sheet-meta">
          <div>当前对象：${data.cardName}</div>
          <div>附件类型：${data.attachmentTitle}</div>
          <div>预览说明：当前为示例预览页，可展示扫描件、PDF 页签、证书附件或设备产权资料。</div>
          <div>打印说明：点击下方“打印”可打印当前预览内容。</div>
        </div>
      `;
    }

    function renderDetailHeadText(module) {
      if (!elements.detailHeadText) return;

      if (module.id === "attachment") {
        const selectedCard = getSelectedCard(module);
        const attachmentSubtype = selectedCard?.subtype || state.activeSubtype;
        if (attachmentSubtype === "营业执照") {
          elements.detailHeadText.textContent = "营业执照在有效期内。";
          return;
        }
        if (attachmentSubtype === "资质证书") {
          elements.detailHeadText.textContent = "资质证书在有效期内，且资质类别与申报范围一致。";
          return;
        }
        if (attachmentSubtype === "安全生产许可证") {
          elements.detailHeadText.textContent = "安全生产许可证在有效期内。";
          return;
        }
        if (attachmentSubtype === "法人身份证复印件") {
          elements.detailHeadText.textContent = "法人身份证复印件已上传。";
          return;
        }
      }

      if (module.id === "personnel") {
        const subtypeText = state.activeSubtype || "人员";
        elements.detailHeadText.textContent = `展示此资质的${subtypeText}核查标准，核查结论和核查附件。`;
        return;
      }

      if (module.id === "equipment") {
        elements.detailHeadText.textContent = "展示此资质的塔式起重机检测记录核查标准，核查结论和核查附件。";
        return;
      }

      if (module.id === "achievement") {
        elements.detailHeadText.textContent = "展示此资质的在施项目核查标准，核查结论和核查附件。";
        return;
      }

      if (module.id === "safety-production") {
        elements.detailHeadText.textContent = "展示此资质的近三年企业安全生产情况核查标准，核查结论和核查附件。";
        return;
      }

      elements.detailHeadText.textContent = "展示核查结论和核查附件。";
    }

    function getLevelBadgeClass(level) {
      if (level === "warn") return "warn";
      if (level === "accent") return "ok";
      return "primary";
    }

    function getSubtypeOptions(module) {
      return module.id === "personnel" || module.id === "equipment" ? module.subtypes : ["全部", ...module.subtypes];
    }

    function getDefaultSubtype(module) {
      return module.id === "personnel" || module.id === "equipment" ? module.subtypes[0] : "全部";
    }

    function getToolbarSubtypeOptions(module) {
      return getSubtypeOptions(module);
    }

    function getFilteredCards(cards) {
      let nextCards = cards;
      if (isPersonnelModule() && state.activeSubtype !== "全部") {
        const matchedSubtypes = getSafetySourceSubtypes(state.activeSubtype);
        nextCards = nextCards.filter((card) => !card.subtype || matchedSubtypes.includes(card.subtype));
      } else if (state.activeSubtype !== "全部") {
        nextCards = nextCards.filter((card) => !card.subtype || card.subtype === state.activeSubtype);
      }
      if (isBuilderModuleView() && state.selectedMajors.length) {
        nextCards = nextCards.filter((card) => state.selectedMajors.includes(getBuilderMajor(card)));
      }
      return nextCards;
    }

    function getCardKey(module, card) {
      return `${module.id}::${card.subtype || ""}::${card.name || ""}`;
    }

    function getSelectedCard(module) {
      const cardsSection = module.sections?.find((section) => section.type === "cards");
      if (!cardsSection) return null;
      const cards = getFilteredCards(cardsSection.cards || []);
      return cards.find((card) => getCardKey(module, card) === state.selectedCardKey) || cards[0] || null;
    }

    function ensureSelectedCard(module) {
      const cardsSection = module.sections?.find((section) => section.type === "cards");
      const cards = cardsSection ? getFilteredCards(cardsSection.cards || []) : [];
      if (!cards.length) {
        state.selectedCardKey = "";
        return;
      }
      if (!cards.some((card) => getCardKey(module, card) === state.selectedCardKey)) {
        state.selectedCardKey = getCardKey(module, cards[0]);
      }
    }

    function getConclusionStateFromBadge(badge) {
      if (!badge) return "";
      if (badge.type === "ok") return "pass";
      if (badge.type === "risk") return "fail";
      return "";
    }

    function getNormalizedResultBadge(badge) {
      if (!badge) return null;
      if (badge.type === "ok") return { text: "达标", type: "ok" };
      if (badge.type === "risk") return { text: "不达标", type: "risk" };
      return { text: "待核查", type: "warn" };
    }

    function shouldEnableCatalogConclusion(module) {
      return module.id === "personnel" || module.id === "equipment" || module.id === "achievement" || module.id === "safety-production" || module.id === "attachment";
    }

    function getCardConclusionState(module, card) {
      const cardKey = getCardKey(module, card);
      if (state.cardConclusion[cardKey]) {
        return state.cardConclusion[cardKey];
      }
      return getConclusionStateFromBadge((card.badges || [])[0] || null);
    }

    function setCardConclusion(cardKey, conclusion) {
      if (!conclusion) {
        delete state.cardConclusion[cardKey];
        return;
      }
      state.cardConclusion[cardKey] = conclusion;
    }

    function getResultBadgeFromConclusion(conclusion) {
      if (conclusion === "pass") return { text: "达标", type: "ok" };
      if (conclusion === "fail") return { text: "不达标", type: "risk" };
      return { text: "待核查", type: "warn" };
    }

    function getEligibleCards(module) {
      const cardsSection = module.sections?.find((section) => section.type === "cards");
      return cardsSection ? getFilteredCards(cardsSection.cards || []) : [];
    }

    function getSelectedCatalogCardKeys(module) {
      const cards = getEligibleCards(module);
      return cards
        .map((card) => getCardKey(module, card))
        .filter((key) => !!state.cardSelection[key]);
    }

    function getSelectedCardDisplayName(module, card) {
      if (!card) return "";
      if (module.id !== "personnel") return card.name || "";
      return (card.name || "").replace(/\s*\/\s*(注册建造师|技术负责人|职称人员|技术工人|A本人员|B本人员|C本人员)\s*$/, "");
    }

    function getPersonnelCardKey(card) {
      return `${card.subtype || ""}::${card.name || ""}`;
    }

    function getSelectedPersonnelCard(module) {
      if (module.id !== "personnel") return null;
      const cardsSection = module.sections?.find((section) => section.type === "cards");
      if (!cardsSection) return null;
      const cards = getFilteredCards(cardsSection.cards || []);
      return cards.find((card) => getPersonnelCardKey(card) === state.selectedPersonnelKey) || cards[0] || null;
    }

    function ensureSelectedPersonnelCard(module) {
      if (module.id !== "personnel") {
        state.selectedPersonnelKey = "";
        return;
      }
      const cardsSection = module.sections?.find((section) => section.type === "cards");
      const cards = cardsSection ? getFilteredCards(cardsSection.cards || []) : [];
      if (!cards.length) {
        state.selectedPersonnelKey = "";
        return;
      }
      if (!cards.some((card) => getPersonnelCardKey(card) === state.selectedPersonnelKey)) {
        state.selectedPersonnelKey = getPersonnelCardKey(cards[0]);
      }
    }

    function getFilteredSections(module) {
      const keyword = state.search.trim().toLowerCase();
      const selectedMajors = isBuilderModuleView(module) ? state.selectedMajors : [];
      if (!keyword && !selectedMajors.length) return module.sections;

      return module.sections.filter((section) => {
        if (section.type === "cards") {
          return getFilteredCards(section.cards || []).some((card) => {
            if (!keyword) return true;
            const bucket = [
              card.name,
              ...(card.meta || []),
              ...((card.badges || []).map((badge) => badge.text))
            ].join(" ").toLowerCase();
            return bucket.includes(keyword);
          });
        }

        const bucket = [
          section.title,
          section.desc,
          ...(section.items || []).flat(),
          ...(section.timeline || []).flat()
        ].join(" ").toLowerCase();
        return bucket.includes(keyword);
      });
    }

    function renderMajorFilter() {
      const enabled = isBuilderModuleView();
      elements.majorFilterWrap.hidden = !enabled;
      elements.toolbarSearch.classList.toggle("builder-search", enabled);

      if (!enabled) {
        state.majorDropdownOpen = false;
        state.majorKeyword = "";
        elements.majorFilterDropdown.hidden = true;
        return;
      }

      elements.majorFilterValue.innerHTML = state.selectedMajors.length
        ? state.selectedMajors.map((item) => `<span class="badge primary filter-chip"><span>${item}</span><span class="filter-chip-remove" data-remove-major="${item}" title="删除">×</span></span>`).join("")
        : `<span class="filter-select-placeholder">注册专业</span>`;
      elements.majorFilterDropdown.hidden = !state.majorDropdownOpen;
      elements.majorFilterInput.value = state.majorKeyword;

      const visibleOptions = getVisibleBuilderMajorOptions();
      elements.majorFilterOptions.innerHTML = visibleOptions.length
        ? visibleOptions.map((item) => `
            <button class="filter-option ${state.selectedMajors.includes(item) ? "active" : ""}" type="button" data-major-option="${item}">
              ${item}
            </button>
          `).join("")
        : `<div class="info-item"><span>未匹配到专业</span><strong>请调整关键字后继续查询。</strong></div>`;
    }

    function renderHeroSummary() {
      if (elements.heroIntro) {
        elements.heroIntro.textContent = "";
      }

      elements.heroCaseNo.innerHTML = `
        <span>案件编号</span>
        <strong>${enterpriseProfile.caseNo}</strong>
      `;

      elements.heroSummary.innerHTML = `
        <div class="hero-summary-item combined">
          <span>${enterpriseProfile.reviewStages.join(" / ")}</span>
          <strong>当前：${enterpriseProfile.reviewStage} / ${enterpriseProfile.deadline}</strong>
        </div>
      `;
    }

    function renderQualificationBoard() {
      elements.qualificationBoard.innerHTML = `
        <div class="qualification-board-head">
          <div>
            <h2>核查资质<span>仅 A本、B本、C本人员按最高要求组一次核查；若多个资质安全证要求一致，则合并为同一依据资质组处理。</span></h2>
          </div>
          <span class="badge primary">覆盖 ${enterpriseProfile.coveredQualifications.length} 项</span>
        </div>
        <div class="qualification-summary-bar">
          <span class="badge primary">依据档位 ${enterpriseProfile.requirementTier}</span>
          <span class="badge primary">依据资质组 ${enterpriseProfile.basisQualificationGroup.length} 项</span>
          <span class="badge ok">自动覆盖 ${enterpriseProfile.coveredQualifications.length} 项</span>
          <span class="badge warn">人员核查只需按依据资质组执行一次</span>
        </div>
        <details class="qualification-collapsible">
          <summary>
            <span>展开查看各资质对 A/B/C 本人员要求及覆盖关系</span>
            <span class="badge primary">展开明细</span>
          </summary>
          <div class="qualification-collapsible-body">
            <div class="qualification-grid">
              ${enterpriseProfile.basisQualificationGroup.map((item) => `
                <article class="qualification-item current">
                  <span>依据资质组</span>
                  <strong>${item}</strong>
                </article>
              `).join("")}
              ${enterpriseProfile.coveredQualifications.map((item) => `
                <article class="qualification-item">
                  <span>覆盖资质</span>
                  <strong>${item}</strong>
                </article>
              `).join("")}
            </div>
            <div class="qualification-matrix">
              <div class="qualification-matrix-head">
                <div class="qualification-matrix-cell">资质名称</div>
                <div class="qualification-matrix-cell">A本要求</div>
                <div class="qualification-matrix-cell">B本要求</div>
                <div class="qualification-matrix-cell">C本要求</div>
                <div class="qualification-matrix-cell">核查关系</div>
                <div class="qualification-matrix-cell">处理方式</div>
              </div>
              ${enterpriseProfile.qualificationRequirementMatrix.map((item) => `
                <div class="qualification-matrix-row ${item.relation === "依据资质组" ? "current" : "covered"}">
                  <div class="qualification-matrix-cell"><strong>${item.name}</strong></div>
                  <div class="qualification-matrix-cell">${item.a}</div>
                  <div class="qualification-matrix-cell">${item.b}</div>
                  <div class="qualification-matrix-cell">${item.c}</div>
                  <div class="qualification-matrix-cell">
                    <span class="qualification-state-badge ${item.relation === "依据资质组" ? "basis" : "covered"}">${item.relation}</span>
                  </div>
                  <div class="qualification-matrix-cell"><span class="qualification-matrix-note">${item.coverage}</span></div>
                </div>
              `).join("")}
            </div>
          </div>
        </details>
      `;
    }

    function renderStandardsSection(module) {
      if (module.id === "personnel") {
        const standards = module.details.standards || {};
        const thresholdText = enterpriseProfile.moduleThresholds?.personnel?.[state.activeSubtype] || "";

        if (state.activeSubtype !== "全部" && standards[state.activeSubtype]) {
          return `
            <section class="focus-card">
              <h4>最高要求组标准</h4>
              <div class="status-list">
                ${thresholdText ? `
                  <div class="status-item">
                    <strong>${thresholdText}</strong>
                  </div>
                ` : ""}
                <div class="status-item">
                  <ul>
                    ${standards[state.activeSubtype].map((item) => `<li>${item}</li>`).join("")}
                  </ul>
                </div>
              </div>
            </section>
          `;
        }

        return "";
      }

      if (module.id === "equipment" || module.id === "achievement" || module.id === "attachment") {
        return `
          <section class="focus-card">
            <h4>核查标准</h4>
            <div class="status-list">
              <div class="status-item">
                <ul>
                  ${module.details.standards.map((item) => `<li>${item}</li>`).join("")}
                </ul>
              </div>
            </div>
          </section>
        `;
      }

      return `
        <section class="focus-card">
          <h4>核查标准</h4>
          <div class="status-list">
            ${module.details.standards.map((item) => `
              <div class="status-item">
                <strong>${item}</strong>
              </div>
            `).join("")}
          </div>
        </section>
      `;
    }

    function renderAlertsSection(module) {
      const personnelCoverageSection = `
        <section class="status-card">
          <h4>覆盖说明</h4>
          <div class="status-list">
            <div class="status-item">
              <strong>本次 A本、B本、C本人员按“${enterpriseProfile.requirementTier}”执行，依据资质组统一核查。</strong>
            </div>
            <div class="status-item">
              <strong>若多个资质安全证要求一致，则合并为同一依据资质组一次核查；仅覆盖要求低于该组的其他申报资质。</strong>
            </div>
          </div>
        </section>
      `;

      if (module.id === "personnel") {
        const alerts = module.details.alerts || {};

        if (state.activeSubtype !== "全部" && alerts[state.activeSubtype]) {
          return `
            ${personnelCoverageSection}
            <section class="status-card">
              <h4>${state.activeSubtype}核查异常提醒</h4>
              <div class="module-tags">
                ${alerts[state.activeSubtype].map((item) => `
                  <span class="badge risk">${item}</span>
                `).join("")}
              </div>
            </section>
          `;
        }

        return `
          ${personnelCoverageSection}
          <section class="status-card">
            <h4>人员分类核查异常提醒</h4>
            <div class="status-list">
              ${Object.entries(alerts).map(([label, items]) => `
                <div class="status-item">
                  <strong>${label}</strong>
                  <div class="module-tags">
                    ${items.map((item) => `
                      <span class="badge risk">${item}</span>
                    `).join("")}
                  </div>
                </div>
              `).join("")}
            </div>
          </section>
        `;
      }

      if (module.id === "equipment" || module.id === "achievement" || module.id === "attachment") {
        return `
          <section class="status-card">
            <h4>${module.name}\u6838\u67e5\u5f02\u5e38\u63d0\u9192</h4>
            <div class="module-tags">
              ${module.details.alerts.map((item) => `
                <span class="badge risk">${item}</span>
              `).join("")}
            </div>
          </section>
        `;
      }

      return `
        <section class="status-card">
          <h4>${module.name}核查异常提醒</h4>
          <div class="status-list">
            ${module.details.alerts.map((item) => `
              <div class="status-item">
                <strong>${item}</strong>
              </div>
            `).join("")}
          </div>
        </section>
      `;
    }

    function renderAttentionSection(module) {
      if (module.id === "personnel" && state.activeSubtype !== "全部") {
        const items = module.details.attention?.[state.activeSubtype] || [];
        if (!items.length) return "";

        return `
          <section class="focus-card">
            <h4>${state.activeSubtype}核查关注内容</h4>
            <div class="status-list">
              ${items.map((item) => `
                <div class="status-item">
                  <strong>${item}</strong>
                </div>
              `).join("")}
            </div>
          </section>
        `;
      }

      return "";
    }

    function renderConclusionSection(module) {
      const groupName = `conclusion-${module.id}-${state.activeSubtype}`;
      const selectedCard = getSelectedCard(module);

                  <article class="entity-card${selectableClass}${selectedClass}${attachmentCardClass} ${isWideCatalogCard ? "full-span" : ""}" ${cardKey ? `data-card-key="${cardKey}"` : ""}>
                    <div class="entity-main">
                      <div class="entity-top ${isPersonnelCard ? "builder-top" : ""}">
                        <h4>${enableCatalogConclusion ? `<input class="catalog-check" type="checkbox" data-card-check="${cardKey}" ${isChecked ? "checked" : ""}>` : ""}${displayIndex ? `<span class="entity-index">${displayIndex}</span>` : ""}${displayTitle}</h4>
                        <div class="entity-head-actions">
                          ${attachmentActions.length ? `
                            <div class="entity-actions">
                              <div class="entity-attachment-card">
                                <button class="entity-attachment-thumb" type="button" data-action-type="preview">${attachmentActions[0].thumbText}</button>
                                <div class="entity-attachment-body">
                                  <div class="entity-attachment-title">${attachmentActions[0].label}</div>
                                  <div class="entity-attachment-tools">
                                    ${attachmentActions.map((action) => `<button class="entity-action-btn" type="button" data-action-type="${action.type}">${action.text}</button>`).join("")}
                                  </div>
                                </div>
                              </div>
                            </div>
                          ` : ""}
                        </div>
                        ${socialInsuranceText ? `<span class="badge primary entity-social-badge">${socialInsuranceText}</span>` : ""}
                        ${displayTopBadge ? `<span class="badge ${displayTopBadge.type} entity-result-badge">${displayTopBadge.text}</span>` : ""}
                      </div>
                      <div class="entity-meta">
                        ${metaBadges.map((badge) => `<span class="badge ${badge.type}">${badge.text}</span>`).join("")}
                      </div>
                      <p>${displayMeta.join("<br>")}</p>
                    </div>
                  </article>
                `}).join("")}
              </div>
            ` : `
              <div class="info-item">
                <span>当前类型下暂无示例卡片</span>
                <strong>已切换到“${state.activeSubtype}”视角，当前示例数据未配置对应目录卡片。</strong>
              </div>
            `}
          </div>
        </section>
      `;
    }

    function renderSections(module) {
      const sections = getFilteredSections(module);
      if (!sections.length) {
        return `
          <section class="section-card">
            <div class="section-body">
              <div class="info-item">
                <span>未匹配到内容</span>
                <strong>当前关键词没有命中展示说明，可以清空搜索后继续查看。</strong>
              </div>
            </div>
          </section>
        `;
      }

      return sections.map((section) => {
        if (section.type === "grid") return renderGridSection(section);
        if (section.type === "cards") return renderCardsSection(section, module);
        return renderTimelineSection(section);
      }).join("");
    }

    function renderContent() {
      const module = getModule();
      ensureSelectedCard(module);
      const primaryCardsSection = module.sections?.find((section) => section.type === "cards");
      const hideHead = false;
      const title = (module.id === "personnel" || module.id === "equipment" || module.id === "achievement") && primaryCardsSection ? primaryCardsSection.title : module.name;
      let desc = module.id === "personnel" || module.id === "equipment" || module.id === "achievement"
        ? (primaryCardsSection?.desc || "")
        : module.desc;
      if (module.id === "personnel") {
        desc = "";
      }
      elements.contentTitle.textContent = title;
      elements.contentDesc.textContent = desc;
      elements.contentDesc.hidden = !desc;
      elements.contentHead.className = hideHead ? "panel-head hidden" : desc ? "panel-head" : "panel-head compact";
      renderSubtypeFilters(module);
      renderMajorFilter();
      elements.contentBody.innerHTML = `${renderOverview(module)}${renderSections(module)}`;
    }

    function renderDetail() {
      const module = getModule();
      renderDetailHeadText(module);
      elements.detailBody.innerHTML = `
        ${renderConclusionSection(module)}
      `;
    }

    function render() {
      renderHeroSummary();
      renderQualificationBoard();
      renderModuleListV2();
      renderContent();
      renderDetail();
      elements.contentBody.scrollTop = 0;
      elements.detailBody.scrollTop = 0;
      elements.moduleList.scrollTop = 0;
    }

    elements.moduleList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-module-id]");
      if (!button) return;
      const nextModule = modules.find((module) => module.id === button.dataset.moduleId);
      if (!nextModule) return;
      state.activeModuleId = button.dataset.moduleId;
      state.activeSubtype = button.dataset.moduleSubtype || getDefaultSubtype(nextModule);
      state.search = "";
      state.selectedMajors = [];
      state.majorKeyword = "";
      state.majorDropdownOpen = false;
      elements.searchInput.value = "";
      render();
    });

    elements.subTypeFilters.addEventListener("click", (event) => {
      const button = event.target.closest("[data-subtype]");
      if (!button) return;
      state.activeSubtype = button.dataset.subtype;
      state.selectedMajors = [];
      state.majorKeyword = "";
      state.majorDropdownOpen = false;
      renderContent();
      renderDetail();
    });

    elements.majorFilterToggle.addEventListener("click", () => {
      if (!isBuilderModuleView()) return;
      state.majorDropdownOpen = !state.majorDropdownOpen;
      renderMajorFilter();
    });

    elements.majorFilterValue.addEventListener("click", (event) => {
      const removeButton = event.target.closest("[data-remove-major]");
      if (!removeButton) return;
      event.stopPropagation();
      const major = removeButton.dataset.removeMajor;
      state.selectedMajors = state.selectedMajors.filter((item) => item !== major);
      renderContent();
      renderDetail();
    });

    elements.majorFilterInput.addEventListener("input", (event) => {
      state.majorKeyword = event.target.value;
      renderMajorFilter();
    });

    elements.majorFilterOptions.addEventListener("click", (event) => {
      const button = event.target.closest("[data-major-option]");
      if (!button) return;
      const major = button.dataset.majorOption;
      if (state.selectedMajors.includes(major)) {
        state.selectedMajors = state.selectedMajors.filter((item) => item !== major);
      } else {
        state.selectedMajors = [...state.selectedMajors, major];
      }
      renderContent();
      renderDetail();
    });

    document.addEventListener("click", (event) => {
      if (elements.majorFilterWrap.hidden) return;
      if (elements.majorFilterWrap.contains(event.target)) return;
      if (!state.majorDropdownOpen) return;
      state.majorDropdownOpen = false;
      renderMajorFilter();
    });

    elements.contentBody.addEventListener("click", (event) => {
      const actionButton = event.target.closest("[data-action-type]");
      if (actionButton) {
        event.stopPropagation();
        const cardNode = actionButton.closest("[data-card-key]");
        const module = getModule();
        if (!cardNode || !module) return;
        const cardsSection = module.sections?.find((section) => section.type === "cards");
        const card = (cardsSection?.cards || []).find((item) => getCardKey(module, item) === cardNode.dataset.cardKey);
        if (!card) return;
        openPreviewModal(module, card, actionButton.dataset.actionType);
        return;
      }

      const card = event.target.closest("[data-card-key]");
      if (!card) return;
      state.selectedCardKey = card.dataset.cardKey;
      renderContent();
      renderDetail();
    });

    elements.contentBody.addEventListener("change", (event) => {
      const batchCheck = event.target.closest("[data-batch-check]");
      if (batchCheck) {
        const module = getModule();
        const cards = getEligibleCards(module);
        cards.forEach((card) => {
          const cardKey = getCardKey(module, card);
          state.cardSelection[cardKey] = batchCheck.checked;
        });
        renderContent();
        return;
      }

      const cardCheck = event.target.closest("[data-card-check]");
      if (cardCheck) {
        state.cardSelection[cardCheck.dataset.cardCheck] = cardCheck.checked;
        renderContent();
      }
    });

    elements.detailBody.addEventListener("change", (event) => {
      const radio = event.target.closest('input[type="radio"][name^="conclusion-"]');
      if (!radio) return;
      const module = getModule();
      const selectedCard = getSelectedCard(module);
      if (!selectedCard) return;
      setCardConclusion(getCardKey(module, selectedCard), radio.value);
      renderContent();
      renderDetail();
    });

    elements.detailBody.addEventListener("click", (event) => {
      const batchButton = event.target.closest("[data-batch-conclusion]");
      if (!batchButton) return;
      const module = getModule();
      if (!module || module.id !== "attachment") return;
      const selectedKeys = getSelectedCatalogCardKeys(module);
      if (!selectedKeys.length) return;
      selectedKeys.forEach((cardKey) => {
        setCardConclusion(cardKey, batchButton.dataset.batchConclusion);
      });
      renderContent();
      renderDetail();
    });

    elements.previewClose.addEventListener("click", closePreviewModal);
    elements.previewConfirm.addEventListener("click", closePreviewModal);
    elements.previewPrint.addEventListener("click", () => {
      if (!state.previewData) return;
      window.print();
    });

    elements.previewModal.addEventListener("click", (event) => {
      if (event.target === elements.previewModal) {
        closePreviewModal();
      }
    });

    elements.searchInput.addEventListener("input", (event) => {
      state.search = event.target.value;
      renderContent();
    });

    elements.searchButton.addEventListener("click", () => {
      renderContent();
      elements.contentBody.scrollTop = 0;
    });

    function submitAndReturn() {
      if (window.opener && !window.opener.closed) {
        window.close();
        return;
      }
      window.location.href = "交任务核查列表.html";
    }

    render();
  </script>
</body>
</html>
