<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>企业资质核查展示页</title>
  <style>
    :root {
      --bg: #f3efe7;
      --panel: rgba(255, 252, 247, 0.92);
      --panel-strong: #fffdfa;
      --line: rgba(91, 67, 43, 0.12);
      --line-strong: rgba(91, 67, 43, 0.18);
      --text: #2f261d;
      --muted: #72685d;
      --primary: #8c4f28;
      --primary-soft: rgba(140, 79, 40, 0.12);
      --accent: #1b695f;
      --accent-soft: rgba(27, 105, 95, 0.14);
      --warn: #cb8a31;
      --warn-soft: rgba(203, 138, 49, 0.16);
      --danger: #b44d3e;
      --danger-soft: rgba(180, 77, 62, 0.15);
      --shadow: 0 22px 52px rgba(58, 41, 25, 0.12);
      --radius-xl: 30px;
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      color: var(--text);
      font-family: "Microsoft YaHei UI", "PingFang SC", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 0% 0%, rgba(140, 79, 40, 0.14), transparent 24%),
        radial-gradient(circle at 100% 0%, rgba(27, 105, 95, 0.14), transparent 22%),
        linear-gradient(135deg, #f9f6f1 0%, #f0e5d7 55%, #e8d8c8 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.45), transparent 84%);
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    .app-shell {
      position: relative;
      height: 100vh;
      padding: 22px;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 18px;
      overflow: hidden;
    }

    .top-sticky-shell {
      position: relative;
      z-index: 40;
      display: grid;
      gap: 18px;
      align-self: start;
      min-height: 0;
    }

    .hero,
    .nav-panel,
    .content-panel,
    .detail-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    .hero {
      border-radius: var(--radius-xl);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      position: relative;
      border: 1px solid rgba(123, 63, 29, 0.12);
      box-shadow: var(--shadow);
      background:
        radial-gradient(circle at top right, rgba(181, 118, 60, 0.22), transparent 30%),
        radial-gradient(circle at left center, rgba(150, 71, 39, 0.14), transparent 34%),
        linear-gradient(180deg, rgba(228, 214, 198, 0.99), rgba(242, 232, 222, 0.97)),
        linear-gradient(135deg, #dfcbb6, #f3e6d8);
      color: var(--text);
      box-shadow:
        inset 0 4px 0 #9e4e2b,
        var(--shadow);
    }

    .hero-main,
    .hero-side {
      padding: 26px 28px;
    }

    .hero-main {
      display: grid;
      gap: 18px;
      padding-right: 580px;
    }

    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      width: fit-content;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      font-size: 0.76rem;
      letter-spacing: 0.04em;
    }

    .hero-main h1 {
      margin: 0;
      font-size: clamp(1.9rem, 4vw, 3rem);
      line-height: 1.15;
      letter-spacing: 0.02em;
      color: #3f2c1d;
    }

    .hero-name-code {
      margin-left: 12px;
      font-size: 0.42em;
      font-weight: 600;
      color: #8a715b;
      white-space: nowrap;
    }

    .hero-main p {
      margin: 0;
      max-width: 860px;
      color: rgba(255, 249, 243, 0.88);
      line-height: 1.8;
      font-size: 0.94rem;
    }

    .hero-top-right {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      gap: 10px;
      max-width: calc(100% - 40px);
    }

    .hero-summary-row {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .hero-case-card {
      position: static;
      width: 260px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255, 251, 246, 0.96);
      border: 1px solid rgba(123, 63, 29, 0.12);
      border-left: 4px solid #9e4e2b;
      backdrop-filter: blur(10px);
      display: grid;
      gap: 4px;
      box-shadow: 0 12px 24px rgba(59, 41, 24, 0.1);
    }

    .hero-case-card span {
      font-size: 0.68rem;
      color: #8a715b;
    }

    .hero-case-card strong {
      font-size: 0.84rem;
      line-height: 1.35;
      color: #3f2c1d;
      word-break: break-all;
    }

    .hero-summary-item {
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255, 251, 246, 0.92);
      border: 1px solid rgba(123, 63, 29, 0.1);
      border-top: 2px solid rgba(158, 78, 43, 0.82);
      display: grid;
      gap: 4px;
    }

    .hero-summary-item.combined {
      margin-left: auto;
      width: fit-content;
      min-width: 0;
      padding: 10px 12px;
      background: rgba(255, 251, 246, 0.96);
      border: 1px solid rgba(123, 63, 29, 0.12);
      border-left: 4px solid #9e4e2b;
      box-shadow: 0 12px 24px rgba(59, 41, 24, 0.1);
      gap: 4px;
    }

    .hero-summary-item span {
      font-size: 0.68rem;
      color: #8a715b;
    }

    .hero-summary-item strong {
      font-size: 0.88rem;
      line-height: 1.28;
      color: #3f2c1d;
    }

    .hero-summary-item.combined span {
      font-size: 0.68rem;
      color: #8a715b;
    }

    .hero-summary-item.combined strong {
      font-size: 0.84rem;
      line-height: 1.35;
      color: #3f2c1d;
      white-space: nowrap;
    }

    .qualification-board {
      background:
        linear-gradient(180deg, rgba(248, 241, 232, 0.98), rgba(255, 250, 244, 0.95)),
        var(--panel);
      border: 1px solid rgba(123, 63, 29, 0.1);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      padding: 12px 16px;
      display: grid;
      gap: 10px;
      box-shadow:
        inset 0 3px 0 rgba(158, 78, 43, 0.82),
        var(--shadow);
    }

    .qualification-board-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .qualification-board-head h2 {
      margin: 0;
      font-size: 0.94rem;
      color: #3f2c1d;
    }

    .qualification-board-head h2 span {
      margin-left: 10px;
      color: #8a715b;
      font-size: 0.74rem;
      line-height: 1.45;
      font-weight: 400;
    }

    .qualification-grid {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      overflow-x: auto;
      overflow-y: hidden;
      padding-bottom: 2px;
      scrollbar-width: thin;
    }

    .qualification-item {
      flex: 0 0 auto;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(123, 63, 29, 0.1);
      background: rgba(255, 252, 248, 0.94);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .qualification-item span {
      font-size: 0.64rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .qualification-item strong {
      font-size: 0.78rem;
      line-height: 1.25;
      color: var(--text);
      white-space: nowrap;
    }

    .qualification-item.current {
      background: linear-gradient(135deg, rgba(158, 78, 43, 0.1), rgba(214, 168, 108, 0.18));
      border-color: rgba(158, 78, 43, 0.24);
      box-shadow: inset 0 0 0 1px rgba(158, 78, 43, 0.08);
    }

    .hero-side {
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      display: grid;
      gap: 14px;
      align-content: center;
      background: rgba(255, 255, 255, 0.06);
    }

    .hero-side h2 {
      margin: 0;
      font-size: 1rem;
      color: rgba(255, 249, 243, 0.96);
    }

    .hero-side p {
      margin: 0;
      color: rgba(255, 249, 243, 0.78);
      line-height: 1.7;
      font-size: 0.84rem;
    }

    .hero-stat-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .hero-stat {
      padding: 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: grid;
      gap: 6px;
    }

    .hero-stat span {
      font-size: 0.72rem;
      color: rgba(255, 249, 243, 0.72);
    }

    .hero-stat strong {
      font-size: 1.35rem;
      line-height: 1;
      color: #fff;
    }

    .workspace {
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 320px;
      gap: 18px;
      min-height: 0;
      height: 100%;
      overflow: hidden;
    }

    .nav-panel,
    .content-panel,
    .detail-panel {
      border-radius: var(--radius-lg);
      min-height: 0;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .content-panel {
      overflow-x: hidden;
      overflow-y: auto;
    }

    .content-top {
      position: sticky;
      top: 0;
      z-index: 6;
      display: grid;
      background: linear-gradient(180deg, rgba(255, 252, 247, 0.98), rgba(255, 252, 247, 0.98));
    }

    .panel-head {
      padding: 20px 20px 14px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.48);
    }

    .panel-head.compact {
      padding: 16px 20px 10px;
    }

    .panel-head.hidden {
      display: none;
    }

    .panel-head h2,
    .panel-head h3 {
      margin: 0;
      font-size: 1rem;
      line-height: 1.3;
    }

    .panel-head p {
      margin: 7px 0 0;
      color: var(--muted);
      line-height: 1.65;
      font-size: 0.8rem;
    }

    .toolbar,
    .detail-summary {
      padding: 14px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.42);
    }

    .nav-scroll,
    .content-scroll,
    .detail-scroll {
      flex: 1 1 auto;
      height: 0;
      min-height: 0;
      overflow: auto;
    }

    .nav-scroll {
      padding: 16px 20px 20px;
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .module-group-card {
      border-radius: 18px;
      border: 1px solid rgba(91, 67, 43, 0.1);
      background: rgba(255, 255, 255, 0.88);
      padding: 12px;
      display: grid;
      gap: 10px;
    }

    .module-group-head {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 10px;
      padding: 2px 2px 0;
    }

    .module-group-head strong {
      font-size: 0.94rem;
      line-height: 1.35;
    }

    .module-group-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.6;
    }

    .module-group-list {
      display: grid;
      gap: 10px;
    }

    .module-nav-item {
      position: relative;
      width: 100%;
      text-align: left;
      border-radius: 16px;
      border: 1px solid rgba(91, 67, 43, 0.08);
      background: rgba(255, 255, 255, 0.92);
      padding: 12px 13px;
      display: grid;
      gap: 8px;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .module-nav-item:hover {
      transform: translateY(-1px);
    }

    .module-nav-item.active {
      border-color: rgba(140, 79, 40, 0.34);
      box-shadow:
        inset 0 0 0 1px rgba(140, 79, 40, 0.12),
        0 12px 24px rgba(140, 79, 40, 0.12);
      background: linear-gradient(135deg, rgba(248, 235, 221, 0.98), rgba(255, 251, 246, 0.92));
    }

    .module-nav-item.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10px;
      bottom: 10px;
      width: 4px;
      border-radius: 0 999px 999px 0;
      background: linear-gradient(180deg, #a85d2d, #d08a45);
    }

    .module-nav-item-top {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 10px;
    }

    .module-nav-item strong {
      font-size: 0.86rem;
      line-height: 1.35;
    }

    .module-nav-item-note {
      color: var(--muted);
      font-size: 0.74rem;
      line-height: 1.55;
    }

    .module-card {
      position: relative;
      width: 100%;
      text-align: left;
      border-radius: 20px;
      border: 1px solid rgba(91, 67, 43, 0.08);
      background: rgba(255, 255, 255, 0.84);
      padding: 16px 16px 15px;
      display: grid;
      gap: 10px;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .module-card:hover {
      transform: translateY(-1px);
    }

    .module-card.active {
      border-color: rgba(140, 79, 40, 0.34);
      box-shadow:
        inset 0 0 0 1px rgba(140, 79, 40, 0.12),
        0 12px 24px rgba(140, 79, 40, 0.12);
      background: linear-gradient(135deg, rgba(248, 235, 221, 0.98), rgba(255, 251, 246, 0.92));
    }

    .module-card.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 14px;
      bottom: 14px;
      width: 4px;
      border-radius: 0 999px 999px 0;
      background: linear-gradient(180deg, #a85d2d, #d08a45);
    }

    .module-card.active strong {
      color: #7b3f1d;
    }

    .module-card.active p {
      color: #6a5644;
    }

    .module-card-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: start;
    }

    .module-card strong {
      font-size: 0.92rem;
      line-height: 1.35;
    }

    .module-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.65;
    }

    .module-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .badge.primary {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .badge.ok {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .badge.warn {
      background: var(--warn-soft);
      color: var(--warn);
    }

    .badge.risk {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .toolbar {
      display: grid;
      gap: 10px;
    }

    .toolbar-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .toolbar-search {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .toolbar-search.builder-search {
      grid-template-columns: minmax(240px, 320px) minmax(0, 1fr) auto;
    }

    .filter-select {
      position: relative;
      min-width: 0;
    }

    .filter-select-toggle {
      width: 100%;
      min-height: 42px;
      border: 1px solid rgba(91, 67, 43, 0.12);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--text);
      padding: 8px 12px;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      text-align: left;
    }

    .filter-select-value {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex-wrap: wrap;
    }

    .filter-select-placeholder {
      color: var(--muted);
      white-space: nowrap;
    }

    .filter-select-arrow {
      color: var(--muted);
      font-size: 0.72rem;
      flex: 0 0 auto;
    }

    .filter-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 100%;
      padding: 10px;
      border-radius: 16px;
      border: 1px solid rgba(91, 67, 43, 0.12);
      background: #fffdf8;
      box-shadow: 0 16px 32px rgba(82, 54, 25, 0.14);
      display: grid;
      gap: 10px;
      z-index: 20;
    }

    .filter-dropdown[hidden] {
      display: none;
    }

    .filter-option-list {
      display: grid;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .filter-option {
      width: 100%;
      border-radius: 12px;
      border: 1px solid rgba(91, 67, 43, 0.1);
      background: rgba(255, 255, 255, 0.96);
      color: var(--text);
      padding: 8px 10px;
      font-size: 0.8rem;
      text-align: left;
    }

    .filter-option.active {
      border-color: rgba(140, 79, 40, 0.2);
      background: rgba(140, 79, 40, 0.08);
      color: var(--primary);
      font-weight: 700;
    }

    .filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding-right: 6px;
    }

    .filter-chip-remove {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border-radius: 999px;
      background: rgba(140, 79, 40, 0.16);
      color: var(--primary);
      font-size: 0.7rem;
      line-height: 1;
      cursor: pointer;
      flex: 0 0 auto;
    }

    @media (max-width: 1200px) {
      .toolbar-search.builder-search {
        grid-template-columns: 1fr;
      }
    }

    .chip-btn {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(91, 67, 43, 0.1);
      background: rgba(255, 255, 255, 0.84);
      color: var(--muted);
      font-size: 0.76rem;
      transition: all 160ms ease;
    }

    .chip-btn.active {
      background: linear-gradient(135deg, rgba(140, 79, 40, 0.12), rgba(27, 105, 95, 0.1));
      color: var(--primary);
      border-color: rgba(140, 79, 40, 0.18);
      font-weight: 700;
    }

    .search-input {
      width: 100%;
      border: 1px solid rgba(91, 67, 43, 0.12);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.92);
      color: var(--text);
      padding: 10px 12px;
      font-size: 0.82rem;
    }

    .search-button {
      min-width: 84px;
      padding: 10px 16px;
      border-radius: 14px;
      background: linear-gradient(135deg, #9d5a2c, #c87e3a);
      color: #fffaf3;
      font-size: 0.82rem;
      font-weight: 700;
      box-shadow: 0 10px 20px rgba(140, 79, 40, 0.16);
    }

    .content-scroll {
      padding: 20px;
      display: grid;
      gap: 16px;
      align-content: start;
      flex: 0 0 auto;
      height: auto;
      min-height: auto;
      overflow: visible;
    }

    .overview-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .overview-card {
      padding: 16px;
      border-radius: 20px;
      border: 1px solid rgba(91, 67, 43, 0.08);
      background: rgba(255, 255, 255, 0.82);
      display: grid;
      gap: 6px;
    }

    .overview-card span {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .overview-card strong {
      font-size: 1.18rem;
      line-height: 1;
    }

    .overview-card p {
      margin: 0;
      color: var(--muted);
      font-size: 0.76rem;
      line-height: 1.6;
    }

    .section-card {
      border-radius: 22px;
      border: 1px solid rgba(91, 67, 43, 0.08);
      background: rgba(255, 255, 255, 0.82);
      overflow: hidden;
    }

    .section-head {
      padding: 18px 18px 14px;
      border-bottom: 1px solid rgba(91, 67, 43, 0.08);
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
      flex-wrap: wrap;
    }

    .section-head h3 {
      margin: 0;
      font-size: 0.96rem;
    }

    .section-head p {
      margin: 6px 0 0;
      color: var(--muted);
      line-height: 1.65;
      font-size: 0.78rem;
    }

    .section-body {
      padding: 16px 18px 18px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .info-item {
      padding: 12px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.76);
      border: 1px solid rgba(91, 67, 43, 0.08);
      display: grid;
      gap: 6px;
    }

    .info-item span {
      font-size: 0.72rem;
      color: var(--muted);
    }

    function getModule() {
      return modules.find((item) => item.id === state.activeModuleId);
    }

    function isBuilderModuleView(module = getModule()) {
      return module?.id === "personnel" && state.activeSubtype === "注册建造师";
    }

    function getBuilderMajor(card) {
      const majorMeta = (card.meta || []).find((item) => item.startsWith("注册专业：")) || "";
      return majorMeta.replace(/^注册专业：/, "").trim();
    }

    function getBuilderMajorOptions() {
      const personnelModule = modules.find((module) => module.id === "personnel");
      const cardsSection = personnelModule?.sections?.find((section) => section.type === "cards");
      const cards = (cardsSection?.cards || []).filter((card) => card.subtype === "注册建造师");
      return [...new Set(cards.map((card) => getBuilderMajor(card)).filter(Boolean))];
    }

    function getVisibleBuilderMajorOptions() {
      const keyword = state.majorKeyword.trim().toLowerCase();
      const options = getBuilderMajorOptions();
      if (!keyword) return options;
      return options.filter((item) => item.toLowerCase().includes(keyword));
    }

    function getCardAttachmentActions(module, card) {
      const isTechLeaderCard = module.id === "personnel" && card.subtype === "技术负责人";
      const isTitlePersonCard = module.id === "personnel" && card.subtype === "职称人员";
      const isTechWorkerCard = module.id === "personnel" && card.subtype === "技术工人";
      const isEquipmentCard = module.id === "equipment";
      const isAttachmentCard = module.id === "attachment" && ["营业执照", "财审报告", "法人身份证复印件"].includes(card.subtype);

      if (!(isTechLeaderCard || isTitlePersonCard || isTechWorkerCard || isEquipmentCard || isAttachmentCard)) {
        return [];
      }

      const attachmentLabel = isAttachmentCard
        ? card.name
        : isEquipmentCard
        ? "设备附件"
        : isTechLeaderCard
          ? "学历/职称附件"
          : isTitlePersonCard
            ? "职称证书附件"
            : "岗位证书附件";

      return [
        { text: "在线预览", type: "preview", label: attachmentLabel, thumbText: "PDF\n附件" },
        { text: "打印", type: "print", label: attachmentLabel }
      ];
    }

    function openPreviewModal(module, card, actionType = "preview") {
      const actions = getCardAttachmentActions(module, card);
      const previewAction = actions.find((item) => item.type === "preview");
      const attachmentTitle = previewAction?.label || "附件资料";
      state.previewData = {
        moduleName: module.name,
        cardName: (card.name || "").replace(/\s*\/\s*(注册建造师|技术负责人|职称人员|技术工人)\s*$/, ""),
        attachmentTitle,
        actionType
      };
      renderPreviewModal();
    }

    function closePreviewModal() {
      state.previewData = null;
      renderPreviewModal();
    }

    function renderPreviewModal() {
      const data = state.previewData;
      elements.previewModal.hidden = !data;
      if (!data) return;

      elements.previewTitle.textContent = `${data.cardName} - ${data.attachmentTitle}`;
      elements.previewSubtitle.textContent = `${data.moduleName}目录附件在线预览，可直接打印。`;
      elements.previewSheet.innerHTML = `
        <div class="preview-sheet-head">
          <strong>${data.attachmentTitle}</strong>
          <span class="badge primary">${data.moduleName}</span>
        </div>
        <div class="preview-sheet-meta">

      if (level === "accent") return "ok";

    function getSubtypeOptions(module) {
      return module.id === "personnel" || module.id === "equipment" ? module.subtypes : ["鍏ㄩ儴", ...module.subtypes];
    }

    function getDefaultSubtype(module) {
      return module.id === "personnel" || module.id === "equipment" ? module.subtypes[0] : "鍏ㄩ儴";
    }

    function getSubtypeOptions(module) {
      return module.id === "personnel" || module.id === "equipment" ? module.subtypes : ["\u5168\u90e8", ...module.subtypes];
    }

    function getDefaultSubtype(module) {
      return module.id === "personnel" || module.id === "equipment" ? module.subtypes[0] : "\u5168\u90e8";

      return getSubtypeOptions(module);

    function getFilteredCards(cards) {
      let nextCards = cards;
      if (state.activeSubtype !== "全部") {
        nextCards = nextCards.filter((card) => !card.subtype || card.subtype === state.activeSubtype);
      }
      if (isBuilderModuleView() && state.selectedMajors.length) {
        nextCards = nextCards.filter((card) => state.selectedMajors.includes(getBuilderMajor(card)));
      }
      return nextCards;
    }

    function getCardKey(module, card) {
      return `${module.id}::${card.subtype || ""}::${card.name || ""}`;
    }

    function getSelectedCard(module) {
      const cardsSection = module.sections?.find((section) => section.type === "cards");
      if (!cardsSection) return null;
      const cards = getFilteredCards(cardsSection.cards || []);
      return cards.find((card) => getCardKey(module, card) === state.selectedCardKey) || cards[0] || null;
    }

    function ensureSelectedCard(module) {
      const cardsSection = module.sections?.find((section) => section.type === "cards");
      const cards = cardsSection ? getFilteredCards(cardsSection.cards || []) : [];
      if (!cards.length) {
        state.selectedCardKey = "";
        return;
      }
      if (!cards.some((card) => getCardKey(module, card) === state.selectedCardKey)) {
        state.selectedCardKey = getCardKey(module, cards[0]);
      }
    }

    function getConclusionStateFromBadge(badge) {
      if (!badge) return "";
      if (badge.type === "ok") return "pass";
      if (badge.type === "risk") return "fail";
      return "";
    }

    function getNormalizedResultBadge(badge) {
      if (!badge) return null;
      if (badge.type === "ok") return { text: "达标", type: "ok" };
      if (badge.type === "risk") return { text: "不达标", type: "risk" };
      return { text: "待核查", type: "warn" };
    }

    function shouldEnableCatalogConclusion(module) {
      return module.id === "personnel" || module.id === "equipment" || module.id === "achievement";
    }

    function getCardConclusionState(module, card) {
      const cardKey = getCardKey(module, card);
      if (state.cardConclusion[cardKey]) {
        return state.cardConclusion[cardKey];
      }
      return getConclusionStateFromBadge((card.badges || [])[0] || null);
    }

    function setCardConclusion(cardKey, conclusion) {
      if (!conclusion) {
        delete state.cardConclusion[cardKey];
        return;
      }
      state.cardConclusion[cardKey] = conclusion;
    }

    function getResultBadgeFromConclusion(conclusion) {
      if (conclusion === "pass") return { text: "达标", type: "ok" };
      if (conclusion === "fail") return { text: "不达标", type: "risk" };
      return { text: "待核查", type: "warn" };
    }

      const cardsSection = module.sections?.find((section) => section.type === "cards");
      return cardsSection ? getFilteredCards(cardsSection.cards || []) : [];
    }

    function getSelectedCatalogCardKeys(module) {
      const cards = getEligibleCards(module);
      return cards
        .map((card) => getCardKey(module, card))
        .filter((key) => !!state.cardSelection[key]);
    }

    function getSelectedCardDisplayName(module, card) {
      if (!card) return "";
      if (module.id !== "personnel") return card.name || "";
      return (card.name || "").replace(/\s*\/\s*(注册建造师|技术负责人|职称人员|技术工人)\s*$/, "");
    }

    function getPersonnelCardKey(card) {
      return `${card.subtype || ""}::${card.name || ""}`;
    }

    function getSelectedPersonnelCard(module) {
      if (module.id !== "personnel") return null;
      const cardsSection = module.sections?.find((section) => section.type === "cards");
      if (!cardsSection) return null;
      const cards = getFilteredCards(cardsSection.cards || []);
      return cards.find((card) => getPersonnelCardKey(card) === state.selectedPersonnelKey) || cards[0] || null;
    }

    function ensureSelectedPersonnelCard(module) {
      if (module.id !== "personnel") {
        state.selectedPersonnelKey = "";
        return;
      }
      const cardsSection = module.sections?.find((section) => section.type === "cards");
      const cards = cardsSection ? getFilteredCards(cardsSection.cards || []) : [];
      if (!cards.length) {
        state.selectedPersonnelKey = "";
        return;
      }
      if (!cards.some((card) => getPersonnelCardKey(card) === state.selectedPersonnelKey)) {
        state.selectedPersonnelKey = getPersonnelCardKey(cards[0]);
      }
    }

    function getFilteredSections(module) {
      const keyword = state.search.trim().toLowerCase();
      const selectedMajors = isBuilderModuleView(module) ? state.selectedMajors : [];
      if (!keyword && !selectedMajors.length) return module.sections;

      return module.sections.filter((section) => {
        if (section.type === "cards") {
          return getFilteredCards(section.cards || []).some((card) => {
            if (!keyword) return true;
            const bucket = [
              card.name,
              ...(card.meta || []),
              ...((card.badges || []).map((badge) => badge.text))
            ].join(" ").toLowerCase();
            return bucket.includes(keyword);
          });
        }

        const bucket = [
          section.title,
          section.desc,
          ...(section.items || []).flat(),
          ...(section.timeline || []).flat()
        ].join(" ").toLowerCase();
        return bucket.includes(keyword);
      });
    }

                      ? card.name.replace(/\s*\/\s*技术负责人\s*$/, "")
                      : isTitlePersonCard
                        ? card.name.replace(/\s*\/\s*职称人员\s*$/, "")
                        : isTechWorkerCard
                          ? card.name.replace(/\s*\/\s*技术工人\s*$/, "")
                          : card.name;
                  const builderIdNumber = isBuilderCard && card.meta.length ? card.meta[0].replace(/^身份证号：/, "").trim() : "";
                  const techLeaderIdNumber = isTechLeaderCard && card.meta.length ? card.meta[0].replace(/^身份证号：/, "").trim() : "";
                  const titlePersonIdNumber = isTitlePersonCard && card.meta.length ? card.meta[0].replace(/^身份证号：/, "").trim() : "";
                  const techWorkerIdNumber = isTechWorkerCard && card.meta.length ? card.meta[0].replace(/^身份证号：/, "").trim() : "";
                  const builderCertificateMeta = isBuilderCard ? (card.meta.find((item) => item.startsWith("\u6ce8\u518c\u8bc1\u4e66\u7f16\u53f7\uff1a")) || "") : "";
                  const builderCertificateNumber = builderCertificateMeta ? builderCertificateMeta.replace(/^\u6ce8\u518c\u8bc1\u4e66\u7f16\u53f7\uff1a/, "").trim() : "";
                  const builderMajorMeta = isBuilderCard ? (card.meta.find((item) => item.startsWith("\u6ce8\u518c\u4e13\u4e1a\uff1a")) || "") : "";
                  const builderMajor = builderMajorMeta ? builderMajorMeta.replace(/^\u6ce8\u518c\u4e13\u4e1a\uff1a/, "").trim() : "";
                  const displayTitle = isBuilderCard && builderIdNumber
                    ? `${displayName} ${builderIdNumber}`
                    : isTechLeaderCard && techLeaderIdNumber
                      ? `${displayName} ${techLeaderIdNumber}`
                      : isTitlePersonCard && titlePersonIdNumber
                        ? `${displayName} ${titlePersonIdNumber}`
                        : isTechWorkerCard && techWorkerIdNumber
                          ? `${displayName} ${techWorkerIdNumber}`
                          : displayName;
                  const socialInsuranceMeta = isPersonnelCard
                    ? (card.meta.find((item) => item.startsWith("\u793e\u4fdd\u7f34\u7eb3\u60c5\u51b5\uff1a")) || "")
                    : "";
                  const socialInsuranceText = socialInsuranceMeta
                    ? "社保2026-03正常"
                    : "";
                  const equipmentOwnershipMeta = isEquipmentCard
                    ? (card.meta.find((item) => item.startsWith("产权归属：")) || "")
                    : "";
                  const equipmentProjectMeta = isEquipmentCard
                    ? (card.meta.find((item) => item.startsWith("使用项目：")) || "")
                    : "";
                  const equipmentMetaLine = isEquipmentCard
                    ? [equipmentOwnershipMeta, equipmentProjectMeta].filter(Boolean).join("　　")
                    : "";
                  const achievementAmountMeta = isAchievementCard
                    ? (card.meta.find((item) => item.startsWith("合同额：")) || "")
                    : "";
                  const achievementStageMeta = isAchievementCard
                    ? (card.meta.find((item) => item.startsWith("项目阶段：")) || "")
                    : "";
                  const achievementExtraMeta = isAchievementCard
                    ? (card.meta.find((item) =>
                        item.startsWith("竣工时间：") ||
                        item.startsWith("结算资料：") ||
                        item.startsWith("验收资料：")
                      ) || "")
                    : "";
                  const achievementMetaLine = isAchievementCard
                    ? [achievementAmountMeta, achievementStageMeta, achievementExtraMeta].filter(Boolean).join("　　")
                    : "";
                  const builderMetaLine = isBuilderCard
                    ? [
                        builderMajor ? `注册专业：${builderMajor}` : "",
                        builderCertificateNumber ? `注册证书编号：${builderCertificateNumber}` : ""
                      ].filter(Boolean).join("　　")
                    : "";
                  const displayMeta = isBuilderCard
                    ? [
                        builderMetaLine,
                        ...card.meta.slice(1).filter((item) =>
                          !item.startsWith("\u6ce8\u518c\u4e13\u4e1a\uff1a") &&
                          !item.startsWith("\u6ce8\u518c\u8bc1\u4e66\u7f16\u53f7\uff1a") &&
                          !item.startsWith("\u793e\u4fdd\u7f34\u7eb3\u60c5\u51b5\uff1a")
                        )
                      ].filter(Boolean)
                    : isTechLeaderCard
                      ? card.meta.slice(1).filter((item) => !item.startsWith("\u793e\u4fdd\u7f34\u7eb3\u60c5\u51b5\uff1a"))
                      : isTitlePersonCard
                      ? card.meta.slice(1).filter((item) => !item.startsWith("\u793e\u4fdd\u7f34\u7eb3\u60c5\u51b5\uff1a"))
                    : isTechWorkerCard
                      ? card.meta.slice(1).filter((item) => !item.startsWith("\u793e\u4fdd\u7f34\u7eb3\u60c5\u51b5\uff1a"))
                    : isEquipmentCard
                      ? [
                          equipmentMetaLine,
                          ...card.meta.filter((item) =>
                            !item.startsWith("产权归属：") &&
                            !item.startsWith("使用项目：") &&
                            !item.startsWith("最近检定：") &&
                            !item.startsWith("最近校准：")
                          )
                        ].filter(Boolean)
                    : isAchievementCard
                      ? [
                          achievementMetaLine,
                          ...card.meta.filter((item) =>
                            !item.startsWith("合同额：") &&
                            !item.startsWith("项目阶段：") &&
                            !item.startsWith("竣工时间：") &&
                            !item.startsWith("结算资料：") &&
                            !item.startsWith("验收资料：")
                          )
                        ].filter(Boolean)
                    : card.meta;
                  const metaBadges = isBuilderCard
                    ? []
                    : isTechLeaderCard || isTitlePersonCard || isTechWorkerCard
                      ? []
                    : isEquipmentCard
                      ? []
                      : isAchievementCard
                        ? []
                        : module.id === "attachment"
                          ? (card.badges || []).slice(1)
                          : (card.badges || []);
                  const displayIndex = isBuilderCard
                    ? currentIndex
                    : isTechLeaderCard
                      ? currentTechLeaderIndex
                      : isTitlePersonCard
                        ? currentTitlePersonIndex
                        : isTechWorkerCard
                          ? currentTechWorkerIndex
                          : isEquipmentCard
                            ? currentEquipmentIndex
                            : isAchievementCard
                            ? currentAchievementIndex
                            : "";
                  const cardKey = getCardKey(module, card);
                  const selectedClass = cardKey === state.selectedCardKey ? " selected" : "";
                  const selectableClass = " selectable";
                  const isChecked = !!state.cardSelection[cardKey];
                  const attachmentActions = getCardAttachmentActions(module, card);
                  const attachmentCardClass = module.id === "attachment" && ["营业执照", "财审报告", "法人身份证复印件"].includes(card.subtype) ? " attachment-card" : "";
                  const currentConclusion = getCardConclusionState(module, card);
                  const displayTopBadge = getResultBadgeFromConclusion(currentConclusion);
                  return `
                  <article class="entity-card${selectableClass}${selectedClass}${attachmentCardClass} ${isWideCatalogCard ? "full-span" : ""}" ${cardKey ? `data-card-key="${cardKey}"` : ""}>
                    <div class="entity-main">
                      <div class="entity-top ${isPersonnelCard ? "builder-top" : ""}">
                        <h4>${enableCatalogConclusion ? `<input class="catalog-check" type="checkbox" data-card-check="${cardKey}" ${isChecked ? "checked" : ""}>` : ""}${displayIndex ? `<span class="entity-index">${displayIndex}</span>` : ""}${displayTitle}</h4>
                        <div class="entity-head-actions">
                          ${attachmentActions.length ? `
                            <div class="entity-actions">
                              <div class="entity-attachment-card">
                                <button class="entity-attachment-thumb" type="button" data-action-type="preview">${attachmentActions[0].thumbText}</button>
                                <div class="entity-attachment-body">
                                  <div class="entity-attachment-title">${attachmentActions[0].label}</div>
                                  <div class="entity-attachment-tools">
                                    ${attachmentActions.map((action) => `<button class="entity-action-btn" type="button" data-action-type="${action.type}">${action.text}</button>`).join("")}
                                  </div>
                                </div>
                              </div>
                            </div>
                          ` : ""}
                        </div>
                        ${socialInsuranceText ? `<span class="badge primary entity-social-badge">${socialInsuranceText}</span>` : ""}
                        ${displayTopBadge ? `<span class="badge ${displayTopBadge.type} entity-result-badge">${displayTopBadge.text}</span>` : ""}
                      </div>
                      <div class="entity-meta">
                        ${metaBadges.map((badge) => `<span class="badge ${badge.type}">${badge.text}</span>`).join("")}
                      </div>
                      <p>${displayMeta.join("<br>")}</p>
                    </div>
                  </article>
                `}).join("")}
              </div>
            ` : `
              <div class="info-item">
                <span>当前类型下暂无示例卡片</span>
                <strong>已切换到“${state.activeSubtype}”视角，当前示例数据未配置对应目录卡片。</strong>
              </div>
            `}
          </div>
        </section>
      `;
    }

    function renderSections(module) {
      const sections = getFilteredSections(module);
      if (!sections.length) {
        return `
          <section class="section-card">
            <div class="section-body">
              <div class="info-item">
                <span>未匹配到内容</span>
                <strong>当前关键词没有命中展示说明，可以清空搜索后继续查看。</strong>
              </div>
            </div>
          </section>
        `;
      }

      return sections.map((section) => {
        if (section.type === "grid") return renderGridSection(section);
        if (section.type === "cards") return renderCardsSection(section, module);
        return renderTimelineSection(section);
      }).join("");
    }

    function renderContent() {
      const module = getModule();
      ensureSelectedCard(module);
      const primaryCardsSection = module.sections?.find((section) => section.type === "cards");
      const hideHead = false;
      const title = (module.id === "personnel" || module.id === "equipment" || module.id === "achievement") && primaryCardsSection ? primaryCardsSection.title : module.name;
      let desc = module.id === "personnel" || module.id === "equipment" || module.id === "achievement"
        ? (primaryCardsSection?.desc || "")
        : module.desc;
      if (module.id === "personnel" && state.activeSubtype === "注册建造师") {
        desc = "覆盖人员基本信息、证书信息、职称证书信息、社保缴纳情况四类核查内容。";
      }
      elements.contentTitle.textContent = title;
      elements.contentDesc.textContent = desc;
      elements.contentDesc.hidden = !desc;
      elements.contentHead.className = hideHead ? "panel-head hidden" : desc ? "panel-head" : "panel-head compact";
      renderSubtypeFilters(module);
      renderMajorFilter();
      elements.contentBody.innerHTML = `${renderOverview(module)}${renderSections(module)}`;
    }

    function renderDetail() {
      const module = getModule();
      renderDetailHeadText(module);
      elements.detailBody.innerHTML = `
        ${renderConclusionSection(module)}
      `;
    }

    function render() {
      renderHeroSummary();
      renderQualificationBoard();
      renderModuleListV2();
      renderContent();
      renderDetail();
      elements.contentBody.scrollTop = 0;
      elements.detailBody.scrollTop = 0;
      elements.moduleList.scrollTop = 0;
    }

    elements.moduleList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-module-id]");
      if (!button) return;
      const nextModule = modules.find((module) => module.id === button.dataset.moduleId);
      if (!nextModule) return;
      state.activeModuleId = button.dataset.moduleId;
      state.activeSubtype = button.dataset.moduleSubtype || getDefaultSubtype(nextModule);
      state.search = "";
      state.selectedMajors = [];
      state.majorKeyword = "";
      state.majorDropdownOpen = false;
      elements.searchInput.value = "";
      render();
    });

    elements.subTypeFilters.addEventListener("click", (event) => {
      const button = event.target.closest("[data-subtype]");
      if (!button) return;
      state.activeSubtype = button.dataset.subtype;
      state.selectedMajors = [];
      state.majorKeyword = "";
      state.majorDropdownOpen = false;
      renderContent();
      renderDetail();
    });

    elements.majorFilterToggle.addEventListener("click", () => {
      if (!isBuilderModuleView()) return;
      state.majorDropdownOpen = !state.majorDropdownOpen;
      renderMajorFilter();
    });

    elements.majorFilterValue.addEventListener("click", (event) => {
      const removeButton = event.target.closest("[data-remove-major]");
      if (!removeButton) return;
      event.stopPropagation();
      const major = removeButton.dataset.removeMajor;
      state.selectedMajors = state.selectedMajors.filter((item) => item !== major);
      renderContent();
      renderDetail();
    });

    elements.majorFilterInput.addEventListener("input", (event) => {
      state.majorKeyword = event.target.value;
      renderMajorFilter();
    });

    elements.majorFilterOptions.addEventListener("click", (event) => {
      const button = event.target.closest("[data-major-option]");
      if (!button) return;
      const major = button.dataset.majorOption;
      if (state.selectedMajors.includes(major)) {
        state.selectedMajors = state.selectedMajors.filter((item) => item !== major);
      } else {
        state.selectedMajors = [...state.selectedMajors, major];
      }
      renderContent();
      renderDetail();
    });

    document.addEventListener("click", (event) => {
      if (elements.majorFilterWrap.hidden) return;
      if (elements.majorFilterWrap.contains(event.target)) return;
      if (!state.majorDropdownOpen) return;
      state.majorDropdownOpen = false;
      renderMajorFilter();
    });

    elements.contentBody.addEventListener("click", (event) => {
      const actionButton = event.target.closest("[data-action-type]");
      if (actionButton) {
        event.stopPropagation();
        const cardNode = actionButton.closest("[data-card-key]");
        const module = getModule();
        if (!cardNode || !module) return;
        const cardsSection = module.sections?.find((section) => section.type === "cards");
        const card = (cardsSection?.cards || []).find((item) => getCardKey(module, item) === cardNode.dataset.cardKey);
        if (!card) return;
        openPreviewModal(module, card, actionButton.dataset.actionType);
        return;
      }

      const card = event.target.closest("[data-card-key]");
      if (!card) return;
      state.selectedCardKey = card.dataset.cardKey;
      renderContent();
      renderDetail();
    });

    elements.contentBody.addEventListener("change", (event) => {
      const batchCheck = event.target.closest("[data-batch-check]");
      if (batchCheck) {
        const module = getModule();
        const cards = getEligibleCards(module);
        cards.forEach((card) => {
          const cardKey = getCardKey(module, card);
          state.cardSelection[cardKey] = batchCheck.checked;
        });
        renderContent();
        return;
      }

      const cardCheck = event.target.closest("[data-card-check]");
      if (cardCheck) {
        state.cardSelection[cardCheck.dataset.cardCheck] = cardCheck.checked;
        renderContent();
      }
    });

    elements.detailBody.addEventListener("change", (event) => {
      const radio = event.target.closest('input[type="radio"][name^="conclusion-"]');
      if (!radio) return;
      const module = getModule();
      const selectedCard = getSelectedCard(module);
      if (!selectedCard) return;
      setCardConclusion(getCardKey(module, selectedCard), radio.value);
      renderContent();
      renderDetail();
    });

    elements.previewClose.addEventListener("click", closePreviewModal);
    elements.previewConfirm.addEventListener("click", closePreviewModal);
    elements.previewPrint.addEventListener("click", () => {
      if (!state.previewData) return;
      window.print();
    });

    elements.previewModal.addEventListener("click", (event) => {
      if (event.target === elements.previewModal) {
        closePreviewModal();
      }
    });

    elements.searchInput.addEventListener("input", (event) => {
      state.search = event.target.value;
      renderContent();
    });

    elements.searchButton.addEventListener("click", () => {
      renderContent();
      elements.contentBody.scrollTop = 0;
    });

    function submitAndReturn() {
      if (window.opener && !window.opener.closed) {
        window.close();
        return;
      }
      window.location.href = "交任务核查列表.html";
    }

    render();
  </script>
</body>
</html>
